async function chargerCatalogueInit(){
  if(!confirm('Ajouter les '+CATALOGUE_INIT.length+' produits du catalogue initial ? Les produits existants ne sont pas modifi\u00e9s.'))return;
  let b=db.batch(),c=0,n=0;
  for(const p of CATALOGUE_INIT){
    const id=slug(p.nom);if(S.produits.find(x=>x.id===id))continue;
    b.set(col('produits').doc(id),{nom:p.nom,cat:p.cat,famille:p.famille,type:p.type,pa:p.pa,pv:p.pv,
      stock:0,seuil:3,actif:true,favori:false,codeBarre:p.nom,maj:Date.now()});
    n++;if(++c>=400){await b.commit();b=db.batch();c=0}
  }
  if(c)await b.commit();
  toast(n+' produits ajout\u00e9s','ok');
}
function codeAppsScript(){
  const code=`// Google Apps Script \u2014 export quotidien Firestore vers Google Sheets
// Extensions > Apps Script, colle ce code, puis D\u00e9clencheurs > Ajouter > exportAnaqa > Horaire > 23h
const PROJET='${(S.cfg||{}).projectId||'TON_PROJET'}';
const BOUTIQUE='${S.bid}';
const CLE='COLLE_ICI_LA_CLE_API_WEB'; // Firebase > Param\u00e8tres > apiKey
const EMAIL='compte@exemple.com';     // compte de service caisse
const MDP='mot_de_passe';

function exportAnaqa(){
  const t=UrlFetchApp.fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CLE,
    {method:'post',contentType:'application/json',payload:JSON.stringify({email:EMAIL,password:MDP,returnSecureToken:true})});
  const id=JSON.parse(t).idToken;
  const hier=Utilities.formatDate(new Date(Date.now()-864e5),'Europe/Paris','yyyy-MM-dd');
  const q={structuredQuery:{from:[{collectionId:'ventes'}],
    where:{fieldFilter:{field:{fieldPath:'date'},op:'EQUAL',value:{stringValue:hier}}}}};
  const r=UrlFetchApp.fetch('https://firestore.googleapis.com/v1/projects/'+PROJET+'/databases/(default)/documents/boutiques/'+BOUTIQUE+':runQuery',
    {method:'post',contentType:'application/json',headers:{Authorization:'Bearer '+id},payload:JSON.stringify(q)});
  const sh=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('BDD')||SpreadsheetApp.getActiveSpreadsheet().insertSheet('BDD');
  if(sh.getLastRow()===0)sh.appendRow(['Date','Ticket','Type','Vendeur','Produit','Qt\u00e9','Prix achat','PV unitaire','Remise','PV total','Marge','Mode de r\u00e8glement']);
  JSON.parse(r).forEach(function(x){
    if(!x.document)return;
    const f=x.document.fields, L=(f.lignes&&f.lignes.arrayValue.values)||[];
    L.forEach(function(lv){
      const l=lv.mapValue.fields, n=function(k){return l[k]?Number(l[k].doubleValue||l[k].integerValue||0):0};
      sh.appendRow([f.date.stringValue,f.num.stringValue,f.type.stringValue,(f.vendeur||{}).stringValue||'',
        l.nom.stringValue,n('qte'),n('pa'),n('pv'),n('remise'),n('total'),
        (n('total')-n('pa')*n('qte')).toFixed(2),(f.mode||{}).stringValue||'Non renseign\u00e9']);
    });
  });
}`;
  modale(`<h2>Export automatique vers Google Sheets</h2>
   <p class="muted">\u00c0 coller dans Apps Script depuis ta feuille Google Sheets, avec un d\u00e9clencheur quotidien \u00e0 23\u00a0h. Une ligne par ligne de vente, colonnes align\u00e9es sur ta BDD.</p>
   <textarea rows="14" style="font-family:monospace;font-size:11px;margin-top:10px" onclick="this.select()">${esc(code)}</textarea>
   <div class="modal-ft"><button class="btn" onclick="fermer()">Fermer</button></div>`,'lg');
}

/* ============ IMPORT EXCEL ============ */
const CATMAP={'livre':'Livre','parfum':'Parfum','enfant':'V\u00eatement enfant'};
function normCat(c){if(!c)return '';const s=String(c).trim(),k=s.toLowerCase();
  return CATMAP[k]||(s===s.toUpperCase()?s.charAt(0)+s.slice(1).toLowerCase():s)}
function titre(s){s=String(s||'').trim();return s?s.charAt(0).toUpperCase()+s.slice(1):''}
let impData=null;
function ouvrirImport(){
  impData=null;
  modale(`<h2>Importer un fichier Excel</h2>
   <p class="muted">Fichier de caisse contenant les feuilles <b>BDD</b>, <b>Liste</b> et <b>Famille produit</b>. Rien n\u2019est \u00e9crit avant ta validation.</p>
   <input type="file" id="fimp" accept=".xlsx,.xls" style="margin:14px 0">
   <div id="iprev"></div>
   <div id="iactions"></div>`,'lg');
  $('#fimp').addEventListener('change',analyserFichier);
}
async function analyserFichier(e){
  const f=e.target.files[0];if(!f)return;
  $('#iprev').innerHTML='<div class="card"><span class="spin" style="border-color:#ddd;border-top-color:var(--or)"></span> Lecture\u2026</div>';
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const nomBDD=wb.SheetNames.find(n=>n.trim().toUpperCase()==='BDD');
    if(!nomBDD)throw new Error('Feuille BDD introuvable');
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[nomBDD],{defval:null});
    const prods={};
    rows.forEach(r=>{
      const k=r['CL\u00c9_FAM']||r['CLE_FAM'];
      if(k&&String(k).trim()){const nom=titre(k);
        prods[nom.toLowerCase()]={nom,cat:normCat(r['CAT_FAM']),famille:nom,type:'famille',
          pa:+r['PA_FAM']||0,pv:+r['PV_FAM']||0}}
    });
    rows.forEach(r=>{
      const k=r['CL\u00c9_SF']||r['CLE_SF'];
      if(k&&String(k).trim()){const nom=titre(k),kk=nom.toLowerCase();if(prods[kk])return;
        const fam=titre(r['FAM_SF']),base=prods[fam.toLowerCase()]||{};
        prods[kk]={nom,cat:normCat(r['CAT_SF']),famille:fam,type:'sousfamille',pa:base.pa||0,pv:base.pv||0}}
    });
    const liste=Object.values(prods);
    const nouveaux=liste.filter(p=>!S.produits.find(x=>x.id===slug(p.nom)));
    const majPrix=liste.filter(p=>{const x=S.produits.find(y=>y.id===slug(p.nom));
      return x&&(Math.abs((+x.pa||0)-p.pa)>0.001||Math.abs((+x.pv||0)-p.pv)>0.001)});
    const ventes=[];
    rows.forEach(r=>{
      const d=r['Date'];if(!d)return;
      const iso=(d instanceof Date)?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):String(d).slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)||iso<DATE_DEBUT)return;
      const nom=titre(r['Sous famille produit']||r['Famille Produit']);if(!nom)return;
      const qte=+r['Qt\u00e9']||1,pa=+r["Prix d'achat"]||0,pv=+r['Prix de vente unitaire']||0;
      const tot=r['Prix de vente total']!=null?+r['Prix de vente total']:pv*qte;
      const m=String(r['Mode de r\u00e8glement']||'').trim().toLowerCase();
      ventes.push({date:iso,nom,ref:slug(nom),qte,pa,pv,total:+(tot||0),
        mode:m.startsWith('cb')?'CB':(m.startsWith('esp')?'ESP':'NR')});
    });
    const ca=ventes.reduce((s,v)=>s+v.total,0);
    const jours=new Set(ventes.map(v=>v.date)).size;
    impData={liste,nouveaux,majPrix,ventes};
    $('#iprev').innerHTML=`<div class="kpis">
      <div class="kpi"><div class="l">Produits dans le fichier</div><div class="v">${liste.length}</div>
        <div class="d">${nouveaux.length} nouveaux \u00b7 ${majPrix.length} prix diff\u00e9rents \u00b7 ${liste.filter(p=>!p.pv).length} sans prix</div></div>
      <div class="kpi"><div class="l">Ventes depuis le ${dateFr(DATE_DEBUT)}</div><div class="v">${nb(ventes.length)}</div>
        <div class="d">${nb(jours)} jours \u00b7 ${eur(ca)}</div></div>
      <div class="kpi"><div class="l">R\u00e8glements</div><div class="v" style="font-size:17px">
        ${nb(ventes.filter(v=>v.mode==='CB').length)} CB \u00b7 ${nb(ventes.filter(v=>v.mode==='ESP').length)} ESP</div>
        <div class="d">${nb(ventes.filter(v=>v.mode==='NR').length)} non renseign\u00e9s</div></div></div>
     <div class="card"><h3>Catalogue</h3>
      <label class="field"><span>Mode d\u2019import</span><select id="imode">
        <option value="ajout">Ajouter uniquement les nouveaux produits</option>
        <option value="prix">Ajouter les nouveaux et mettre \u00e0 jour les prix</option>
        <option value="remplacer">Remplacer le catalogue (les absents passent en inactif)</option>
      </select></label>
      <button class="btn" onclick="importerCatalogue()">Importer le catalogue</button></div>
     <div class="card"><h3>Historique des ventes</h3>
      <p class="muted">Les ventes sont regroup\u00e9es par jour et par mode de r\u00e8glement, marqu\u00e9es \u00ab\u00a0import\u00a0\u00bb et non modifiables. Le stock n\u2019est pas impact\u00e9. \u00c0 ne faire qu\u2019une fois.</p>
      <button class="btn ghost" style="margin-top:10px" onclick="importerHistorique()">Importer ${nb(ventes.length)} lignes de vente</button></div>`;
  }catch(err){$('#iprev').innerHTML=`<div class="card"><p style="color:var(--rouge)">Lecture impossible : ${esc(err.message)}</p></div>`}
}
async function importerCatalogue(){
  if(!impData)return;
  const mode=$('#imode').value;
  if(mode==='remplacer'&&!confirm('Remplacer le catalogue ? Les produits absents du fichier passeront en inactif (aucune suppression).'))return;
  let b=db.batch(),c=0,add=0,upd=0,off=0;
  const vus=new Set();
  for(const p of impData.liste){
    const id=slug(p.nom);vus.add(id);
    const ex=S.produits.find(x=>x.id===id);
    if(!ex){b.set(col('produits').doc(id),{nom:p.nom,cat:p.cat,famille:p.famille,type:p.type,pa:p.pa,pv:p.pv,
        stock:0,seuil:3,actif:true,favori:false,codeBarre:p.nom,maj:Date.now()});add++;c++}
    else if(mode!=='ajout'&&(Math.abs((+ex.pa||0)-p.pa)>0.001||Math.abs((+ex.pv||0)-p.pv)>0.001)){
      b.update(col('produits').doc(id),{pa:p.pa,pv:p.pv,cat:p.cat||ex.cat,maj:Date.now()});upd++;c++}
    if(c>=400){await b.commit();b=db.batch();c=0}
  }
  if(mode==='remplacer')for(const ex of S.produits){
    if(!vus.has(ex.id)&&ex.actif!==false){b.update(col('produits').doc(ex.id),{actif:false});off++;c++;
      if(c>=400){await b.commit();b=db.batch();c=0}}}
  if(c)await b.commit();
  await col('imports').add({ts:Date.now(),date:today(),par:S.vendeur.nom,type:'catalogue',mode,ajouts:add,maj:upd,desactives:off});
  toast(add+' ajout\u00e9s \u00b7 '+upd+' mis \u00e0 jour'+(off?' \u00b7 '+off+' d\u00e9sactiv\u00e9s':''),'ok');
}
async function importerHistorique(){
  if(!impData||!impData.ventes.length)return;
  if(!confirm('Importer '+impData.ventes.length+' lignes de vente ? \u00c0 ne faire qu\u2019une seule fois.'))return;
  const grp={};
  impData.ventes.forEach(v=>{const k=v.date+'|'+v.mode;(grp[k]=grp[k]||[]).push(v)});
  const cles=Object.keys(grp);
  let b=db.batch(),c=0,n=0;
  for(const k of cles){
    const [date,mode]=k.split('|'),L=grp[k];
    const total=+L.reduce((s,x)=>s+x.total,0).toFixed(2);
    const marge=+L.reduce((s,x)=>s+(x.total-x.pa*x.qte),0).toFixed(2);
    const id='IMP-'+date+'-'+mode;
    b.set(col('ventes').doc(id),{num:id,date,ts:new Date(date+'T20:00:00').getTime(),type:'VENTE',origine:'import',
      vendeur:'Historique',vendeurId:'import',refs:[...new Set(L.map(x=>x.ref))],
      lignes:L.map(x=>({ref:x.ref,nom:x.nom,qte:x.qte,pa:x.pa,pv:x.pv,remise:0,total:x.total})),
      remiseTicket:0,remiseTotale:0,total,marge,
      reglements:mode==='NR'?[]:[{mode,montant:total}],mode});
    n++;if(++c>=300){await b.commit();b=db.batch();c=0;toast(n+' / '+cles.length+' jours\u2026')}
  }
  if(c)await b.commit();
  await col('imports').add({ts:Date.now(),date:today(),par:S.vendeur.nom,type:'historique',jours:n,lignes:impData.ventes.length});
  S.ventesCache=null;fermer();toast('Historique import\u00e9 : '+n+' regroupements','ok');
}

/* ============ DOUCHETTE CODE-BARRES ============ */
let buf='',bufT=0;
document.addEventListener('keydown',e=>{
  if(!S.vendeur||S.page!=='caisse')return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(document.getElementById('modals').innerHTML)return;
  const now=Date.now();
  if(now-bufT>120)buf='';
  bufT=now;
  if(e.key==='Enter'){if(buf.length>1)scanner(buf);buf='';return}
  if(e.key.length===1)buf+=e.key;
});

/* ============ VERSION ET MISE A JOUR ============ */
const APP_VERSION='1.9.7';
let versionDispo=null;
async function verifierVersion(silencieux){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const t=await r.text();
    const m=t.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if(!m)throw 0;
    if(m[1]!==APP_VERSION){versionDispo=m[1];bandeauMaj()}
    else if(!silencieux)toast('Tu es \u00e0 jour \u2014 version '+APP_VERSION,'ok');
  }catch(e){if(!silencieux)toast('V\u00e9rification impossible (hors ligne ?)','ko')}
}
function bandeauMaj(){
  if(document.getElementById('bmaj'))return;
  const d=document.createElement('div');d.id='bmaj';
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:950;'
   +'background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;padding:12px 20px;'
   +'border-radius:12px;box-shadow:var(--ombre-f);font-weight:600;font-size:14px;cursor:pointer;'
   +'display:flex;align-items:center;gap:10px';
  d.innerHTML='\u21bb Version '+versionDispo+' disponible <span style="opacity:.8;font-weight:500">\u00b7 Recharger</span>';
  d.onclick=rechargerApp;
  document.body.appendChild(d);
}
async function rechargerApp(){
  try{
    if('caches' in window){const k=await caches.keys();await Promise.all(k.map(c=>caches.delete(c)))}
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()))}
  }catch(e){}
  location.reload(true);
}
setTimeout(()=>verifierVersion(true),4000);
setInterval(()=>verifierVersion(true),600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verifierVersion(true)});
