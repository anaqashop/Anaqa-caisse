<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anaqa Shop — Caisse</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#B8935A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anaqa Shop">
<style>
:root{
  --or-clair:#D4B87A; --or:#B8935A; --or-fonce:#8B6914; --or-pale:#F2E6D0;
  --creme:#FDFBF7; --creme2:#F7F2E9; --anthracite:#2C2823; --gris:#7A736A; --gris-clair:#E6DFD3;
  --rouge:#C0392B; --vert:#2E7D53; --bleu:#2B6CB0;
  --r:14px; --ombre:0 2px 14px rgba(139,105,20,.10); --ombre-f:0 8px 30px rgba(44,40,35,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--creme);color:var(--anthracite);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--or);color:#fff;font-weight:600;transition:transform .08s,filter .15s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--or-fonce);border:1.5px solid var(--gris-clair)}
.btn.ghost:hover{background:var(--creme2)}
.btn.danger{background:var(--rouge)}
.btn.vert{background:var(--vert)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.xl{padding:18px 22px;font-size:18px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-icon{width:42px;height:42px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--creme2);color:var(--anthracite)}

/* ---------- Champs ---------- */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;color:var(--gris);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--gris-clair);border-radius:11px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(184,147,90,.15)}
.row{display:flex;gap:12px}.row>*{flex:1}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;box-shadow:var(--ombre)}
header.top .logo{font-family:Georgia,'Times New Roman',serif;font-size:19px;letter-spacing:.06em}
header.top .sp{flex:1}
.badge-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.pastille{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--or-fonce);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
nav.bottom{display:flex;background:#fff;border-top:1px solid var(--gris-clair);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gris);font-size:11px;font-weight:600}
nav.bottom button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--or-fonce)}
nav.bottom button.on svg{stroke:var(--or-fonce)}
.page{padding:16px;max-width:1400px;margin:0 auto}
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--ombre);margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:12px;color:var(--or-fonce)}
.muted{color:var(--gris);font-size:13px}

/* ---------- Caisse ---------- */
.caisse{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:900px){.caisse{grid-template-columns:1fr;padding:12px}}
.searchbar{display:flex;gap:10px;margin-bottom:12px}
.searchbar input{font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--gris-clair);font-size:13px;white-space:nowrap;font-weight:600;color:var(--gris)}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
.pastille-prod{background:#fff;border-radius:12px;padding:11px 9px;box-shadow:var(--ombre);text-align:left;display:flex;flex-direction:column;gap:5px;min-height:84px;border:1.5px solid transparent;transition:transform .08s}
.pastille-prod:active{transform:scale(.96);border-color:var(--or)}
.pastille-prod .n{font-weight:600;font-size:13.5px;line-height:1.25}
.pastille-prod .p{color:var(--or-fonce);font-weight:700;font-size:15px;margin-top:auto}
.pastille-prod .s{font-size:11px;color:var(--gris)}
.pastille-prod .s.bas{color:var(--rouge);font-weight:700}
.pastille-prod.rupture{opacity:.55}

.panier{background:#fff;border-radius:var(--r);box-shadow:var(--ombre);display:flex;flex-direction:column;position:sticky;top:14px;max-height:calc(100vh - 150px)}
.panier .hd{padding:13px 15px;border-bottom:1px solid var(--gris-clair);display:flex;align-items:center;gap:8px}
.panier .lignes{overflow-y:auto;flex:1;min-height:70px}
.ligne{padding:10px 14px;border-bottom:1px solid var(--creme2);display:flex;gap:9px;align-items:center}
.ligne .info{flex:1;min-width:0}
.ligne .nom{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .det{font-size:12px;color:var(--gris)}
.ligne .remise{color:var(--rouge);font-weight:700;font-size:12px}
.qte{display:flex;align-items:center;gap:6px}
.qte button{width:28px;height:28px;border-radius:8px;background:var(--creme2);font-weight:700;font-size:16px;line-height:1}
.qte span{min-width:22px;text-align:center;font-weight:700}
.ligne .tot{font-weight:700;min-width:62px;text-align:right}
.panier .ft{padding:13px 15px;border-top:1px solid var(--gris-clair);background:var(--creme)}
.tot-l{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
.tot-l.grand{font-size:23px;font-weight:700;color:var(--or-fonce);margin:9px 0}
.tot-l.rem{color:var(--rouge);font-weight:600}
.vide{padding:34px 16px;text-align:center;color:var(--gris);font-size:13.5px}

/* ---------- Modale ---------- */
.overlay{position:fixed;inset:0;background:rgba(44,40,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;box-shadow:var(--ombre-f);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:20px}
.modal.lg{max-width:900px}
.modal h2{font-size:18px;margin-bottom:14px;color:var(--or-fonce)}
.modal-ft{display:flex;gap:10px;margin-top:18px}.modal-ft>*{flex:1}

/* ---------- PIN ---------- */
.pinwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:linear-gradient(160deg,var(--creme),var(--or-pale));padding:22px;text-align:center}
.pinwrap .marque{font-family:Georgia,serif;font-size:29px;color:var(--or-fonce);letter-spacing:.09em}
.pinwrap .sous{color:var(--gris);font-size:13px;margin-bottom:22px;letter-spacing:.16em;text-transform:uppercase}
.vendeurs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:430px;margin-bottom:20px}
.v-btn{background:#fff;border-radius:14px;padding:13px 17px;box-shadow:var(--ombre);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;border:2px solid transparent}
.v-btn.on{border-color:var(--or)}
.v-btn .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:11px;justify-content:center}
.pad button{height:62px;border-radius:15px;background:#fff;box-shadow:var(--ombre);font-size:22px;font-weight:600}
.pad button:active{background:var(--or-pale)}
.points{display:flex;gap:13px;justify-content:center;margin:16px 0 20px;height:16px}
.points i{width:15px;height:15px;border-radius:50%;background:var(--gris-clair);transition:background .15s,transform .15s}
.points i.on{background:var(--or-fonce);transform:scale(1.13)}
.err{color:var(--rouge);font-weight:600;font-size:13.5px;min-height:19px;margin-top:8px}

/* ---------- Tableaux / listes ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);padding:8px 8px;border-bottom:1.5px solid var(--gris-clair);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--creme2)}
tr.alerte td{background:#FDF2F0}
.tright{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.cb{background:#E5EEF8;color:var(--bleu)}
.pill.esp{background:#E6F4EC;color:var(--vert)}
.pill.mix{background:#F3EAF8;color:#6B3FA0}
.pill.nr{background:var(--creme2);color:var(--gris)}
.pill.ret{background:#FDECEA;color:var(--rouge)}

/* ---------- Stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--ombre)}
.kpi .l{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-size:25px;font-weight:700;color:var(--or-fonce);margin-top:3px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--gris);margin-top:2px}
.bar{height:9px;background:var(--gris-clair);border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--or-clair),var(--or-fonce));border-radius:99px;transition:width .4s}
.barline{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13px}
.barline .nm{width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barline .bb{flex:1;height:19px;background:var(--creme2);border-radius:7px;overflow:hidden}
.barline .bb>i{display:block;height:100%;background:linear-gradient(90deg,var(--or-clair),var(--or));border-radius:7px}
.barline .vl{width:88px;text-align:right;font-weight:700;font-size:13px}

.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 15px;border-radius:10px;background:#fff;border:1.5px solid var(--gris-clair);font-weight:600;font-size:13.5px;color:var(--gris)}
.tabs button.on{background:var(--anthracite);border-color:var(--anthracite);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--anthracite);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--ombre-f);z-index:900;font-weight:600;font-size:14px;animation:up .25s}
.toast.ok{background:var(--vert)}.toast.ko{background:var(--rouge)}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}}
.spin{width:19px;height:19px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--rouge);color:#fff;text-align:center;padding:5px;font-size:12.5px;font-weight:600}

/* ---------- Ticket ---------- */
#ticket{width:58mm;padding:3mm;font-family:'Courier New',monospace;font-size:11px;color:#000;background:#fff;line-height:1.35}
#ticket .c{text-align:center}#ticket .b{font-weight:700}
#ticket hr{border:none;border-top:1px dashed #000;margin:5px 0}
#ticket table{font-size:10.5px}#ticket td{padding:1px 0;border:none}
@media print{
  body *{visibility:hidden!important}
  #ticket,#ticket *,#planche,#planche *{visibility:visible!important}
  #ticket{position:absolute;left:0;top:0;width:58mm;box-shadow:none}
  #planche{position:absolute;left:0;top:0;width:100%}
  @page{margin:4mm}
}
/* ---------- v1.3 : bandeau CA, panier mobile, favoris ---------- */
.cajour{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;border-radius:var(--r);padding:12px 16px;margin-bottom:12px;box-shadow:var(--ombre)}
.cajour .l{font-size:11.5px;opacity:.85;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cajour .v{font-size:26px;font-weight:700;line-height:1.1}
.cajour .d{font-size:12px;opacity:.9}
.cajour .sep{flex:1}
.cajour .mini{text-align:right}
.cajour .mini .v{font-size:17px}
.searchbar input{font-size:17px;padding:15px 16px;border-width:2px}
.searchbar input:focus{border-color:var(--or-fonce)}
.pastille-prod .fav{position:absolute;top:5px;right:7px;font-size:15px;line-height:1;color:var(--or);opacity:.45}
.pastille-prod .fav.on{opacity:1}
.pastille-prod{position:relative}
.vide-fav{grid-column:1/-1;text-align:center;padding:26px 14px;color:var(--gris);font-size:13.5px}
@media(max-width:900px){
  .panier{position:fixed;left:0;right:0;bottom:var(--nav-h,calc(64px + env(safe-area-inset-bottom,0px)));top:auto;z-index:600;border-radius:16px 16px 0 0;max-height:70vh;box-shadow:0 -6px 24px rgba(44,40,35,.18)}
  .panier.replie .lignes,.panier.replie .hd{display:none}
  .panier .hd{cursor:pointer}
  .caisse{padding-bottom:120px}
}
.barre-panier{display:flex;align-items:center;gap:12px;width:100%}
.barre-panier .info{flex:1;min-width:0}
.barre-panier .nb{font-size:12.5px;color:var(--gris)}
.barre-panier .tt{font-size:21px;font-weight:700;color:var(--or-fonce);line-height:1.1}
.vsel{display:flex;flex-wrap:wrap;gap:10px}
.vsel button{flex:1 1 40%;background:#fff;border:2px solid var(--gris-clair);border-radius:14px;padding:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.vsel button.on{border-color:var(--or);background:var(--creme2)}
.vsel .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* ---------- v1.7 : compactage, menu doré, favoris, retour haut ---------- */
.cajour{padding:9px 14px;margin-bottom:9px}
.cajour .v{font-size:20px}
.cajour .d{font-size:11.5px}
.cajour .mini .v{font-size:15px}
.searchwrap{position:relative;flex:1}
.searchwrap input{padding:11px 42px 11px 14px;font-size:16px;border-width:2px}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--creme2);color:var(--gris);display:flex;align-items:center;justify-content:center;font-size:15px}
.searchbar{margin-bottom:8px}
.chips{flex-wrap:wrap;overflow:visible;padding-bottom:6px;margin-bottom:6px;gap:6px}
.chip{padding:6px 12px;font-size:12.5px}
nav.bottom button{padding:7px 4px 8px;font-size:10.5px;color:var(--or)}
nav.bottom button svg{width:21px;height:21px;stroke:var(--or)}
nav.bottom button .ico{width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .15s}
nav.bottom button.on{color:var(--or-fonce)}
nav.bottom button.on .ico{background:linear-gradient(135deg,var(--or-clair),var(--or-fonce))}
nav.bottom button.on svg{stroke:#fff}
.fab-haut{position:fixed;right:16px;bottom:calc(var(--nav-h,calc(64px + env(safe-area-inset-bottom,0px))) + 96px);z-index:700;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--or-clair),var(--or-fonce));color:#fff;font-size:20px;box-shadow:var(--ombre-f);display:none;align-items:center;justify-content:center}
.fab-haut.on{display:flex}
@media(min-width:901px){.fab-haut{bottom:24px}}
.bandeau-fav{grid-column:1/-1;background:var(--or-pale);color:var(--or-fonce);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;margin-bottom:4px}
.pastille-prod.mode-fav{border:1.5px dashed var(--or)}
.pastille-prod .epingle{background:var(--or);color:#fff;border-radius:7px;font-size:11px;font-weight:700;padding:3px 0;text-align:center;margin-top:auto}
tr.neg td{background:#FDECEA}

/* ---------- v1.8 : bouton remise par ligne ---------- */
.btn-remise{background:#FDECEA;color:var(--rouge);border:1.5px solid #F3C9C3;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;min-width:78px;min-height:40px;white-space:nowrap}
.btn-remise:active{transform:scale(.96)}
.btn-remise.on{background:var(--rouge);color:#fff;border-color:var(--rouge)}
@media(max-width:620px){
  .ligne{flex-wrap:wrap}
  .ligne .info{flex:1 1 100%}
  .ligne .btn-remise{margin-left:auto}
}

/* ---------- v1.9.1 : caisse epuree sur telephone ---------- */
@media(max-width:620px){
  .caisse .chips-wrap,.caisse .chips,.caisse #astuce{display:none}
  .caisse .cajour{padding:8px 12px;margin-bottom:8px}
  .caisse .cajour .v{font-size:18px}
  .caisse .searchbar{margin-bottom:10px}
}

/* ---------- v1.9.2 : lisibilité sur téléphone ---------- */
@media(max-width:620px){
  header.top{padding:8px 12px;gap:8px}
  header.top .logo{font-size:15px;white-space:nowrap}
  .badge-user{padding:5px 10px;font-size:12.5px}
  .badge-user .pastille{width:23px;height:23px;font-size:11px}
  .page{padding:12px 10px}
  .card{padding:13px 12px}

  /* KPI compacts sur une bande */
  .kpis{grid-template-columns:repeat(3,1fr);gap:7px}
  .kpi{padding:10px 8px;text-align:center}
  .kpi .l{font-size:9.5px;line-height:1.2}
  .kpi .v{font-size:17px}
  .kpi .d{font-size:10px}

  /* Boutons d'action en pleine largeur, un par ligne */
  .card .row{flex-direction:column}
  .card .row>*{width:100%}
  .btn{white-space:nowrap}

  /* Tableaux transformés en cartes empilées */
  table.mob{display:block}
  table.mob thead{display:none}
  table.mob tbody,table.mob tr{display:block}
  table.mob tr{border:1px solid var(--gris-clair);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
  table.mob tr.alerte,table.mob tr.neg{background:#FDF2F0;border-color:#F3C9C3}
  table.mob td{display:block;border:none;padding:1px 0;text-align:left!important}
  table.mob td:first-child{font-size:15px;margin-bottom:3px}
  table.mob td:not(:first-child){font-size:12.5px;color:var(--gris)}
  table.mob td[data-l]:not(:empty):before{content:attr(data-l) " ";font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris)}
  table.mob td:last-child{margin-top:8px}
  table.mob td:last-child .btn{width:100%}
  .searchbar{flex-direction:column;align-items:stretch}
  .searchbar>.btn{width:100%}
}

/* ---------- v1.9.3 : panier rétractable sur téléphone ---------- */
.fleche-panier{display:none}
@media(max-width:900px){
  .fleche-panier{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--creme2);color:var(--or-fonce);font-size:14px;flex-shrink:0}
  .panier.replie .ft{padding:10px 14px}
  .panier.replie .ft .tot-l.rem,.panier.replie .ft .btn-ticket{display:none}
  .panier.replie .barre-panier .tt{font-size:19px}
  .panier.replie .barre-panier .btn.xl{padding:12px 18px;font-size:16px;min-height:44px}
  .panier .barre-panier{cursor:pointer}
  .caisse{padding-bottom:90px}
}
@keyframes flashPanier{0%{background:var(--or-pale)}100%{background:var(--creme)}}
.panier .ft.flash{animation:flashPanier .6s ease-out}

/* ---------- v1.9.4 : barre CA, objectif, stats, aperçu ticket ---------- */
.cajour{display:flex;align-items:baseline;gap:10px;padding:8px 14px!important;margin-bottom:8px!important}
.cajour .l{font-size:11px}
.cajour .v{font-size:19px!important}
.cajour .d{font-size:12px;opacity:.9}
.objbar{background:#fff;border-radius:11px;box-shadow:var(--ombre);padding:7px 12px;margin:0 0 10px;font-size:12.5px;color:var(--gris)}
.objbar .haut{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.objbar .haut b{color:var(--anthracite)}
.objbar .track{height:7px;background:var(--gris-clair);border-radius:99px;overflow:hidden}
.objbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--or-clair),var(--or-fonce));border-radius:99px;transition:width .4s}
.objbar.ok .track i{background:var(--vert)}
.objbar.ok .haut b{color:var(--vert)}
.periode{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.periode .tabs{margin-bottom:0}
.periode .l2{display:flex;gap:8px}
.date-wrap{position:relative;display:inline-flex}
.date-wrap .btn{min-width:120px}
.date-wrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ticket-apercu{font-family:'Courier New',monospace;font-size:12px;color:#000;background:#fff;line-height:1.4;max-width:300px;margin:0 auto 14px;padding:14px;border:1px dashed #bbb;border-radius:6px}
.ticket-apercu .c{text-align:center}.ticket-apercu .b{font-weight:700}
.ticket-apercu hr{border:none;border-top:1px dashed #000;margin:6px 0}
.ticket-apercu table{font-size:11.5px}.ticket-apercu td{padding:1px 0;border:none}
.repli-hd{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.repli-hd h3{margin:0!important;flex:1}
@media(max-width:620px){
  .kpis.k4{grid-template-columns:repeat(2,1fr)}
  .periode .tabs button{flex:1;padding:8px 6px;font-size:13px}
  .periode .l2>*{flex:1}
  .date-wrap .btn{width:100%}
}

/* ---------- v1.9.6 : réglage des objectifs ---------- */
.semnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.semnav b{flex:1;text-align:center;white-space:nowrap;font-size:15px}
.semnav .rond{width:38px;height:38px;border-radius:50%;background:var(--creme2);color:var(--or-fonce);font-size:13px;flex:0 0 38px;display:flex;align-items:center;justify-content:center}
.lbl-def{display:block;font-size:12.5px;color:var(--gris);margin-bottom:5px;font-weight:600;white-space:nowrap}
.defligne{display:flex;gap:8px;align-items:stretch}
.defligne input{flex:1;min-width:0}
.defligne .btn{flex:0 0 auto;width:auto!important}

/* ---------- v1.9.7 : produits par catégorie repliable ---------- */
.replis-outils{display:flex;gap:8px;margin-bottom:10px}
.grp-prod{border:1px solid var(--gris-clair);border-radius:12px;margin-bottom:8px;overflow:hidden;background:#fff}
.grp-hd{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;user-select:none;flex-wrap:wrap}
.grp-hd:active{background:var(--creme2)}
.grp-fl{color:var(--or-fonce);font-size:12px;width:14px}
.grp-al{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--rouge);background:#FDECEA;border-radius:999px;padding:2px 9px}
.grp-prod table{margin:0}
.grp-prod>div{padding:0 10px 10px}
@media(max-width:620px){.replis-outils{flex-direction:row}.replis-outils .btn{flex:1}}

/* ---------- v2.0 : mode inventaire ---------- */
.inv-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gris)}
.inv-prog b{color:var(--anthracite);font-size:15px}
.inv-track{flex:1;height:8px;background:var(--gris-clair);border-radius:99px;overflow:hidden}
.inv-track i{display:block;height:100%;background:linear-gradient(90deg,var(--or-clair),var(--or-fonce));transition:width .3s}
.inv-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--creme2)}
.inv-row .info{flex:1;min-width:0}
.inv-row .nom{font-weight:600;font-size:14px}
.inv-row .det{font-size:12px;color:var(--gris)}
.inv-in{width:78px!important;text-align:center;font-size:16px!important;padding:9px 6px!important}
.inv-ec{width:44px;text-align:right;font-weight:700;font-size:14px}

/* ---------- v2.1 : prix dans l'inventaire ---------- */
.inv-row{flex-wrap:wrap}
.inv-champs{display:flex;align-items:flex-end;gap:6px}
.inv-lb{display:flex;flex-direction:column;gap:2px}
.inv-lb span{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.03em;text-align:center}
.inv-px{width:70px!important;text-align:center;font-size:14px!important;padding:8px 4px!important}
.inv-px[readonly]{background:var(--creme2);color:var(--gris)}
.inv-px.modif{border-color:var(--or-fonce)!important;background:var(--or-pale)}
@media(max-width:620px){
  .inv-row .info{flex:1 1 100%}
  .inv-champs{width:100%;justify-content:space-between}
  .inv-px{width:66px!important}
  .inv-in{width:70px!important}
}

/* ---------- v2.2 : marques ---------- */
.pastille-prod .mq{font-size:11px;font-style:italic;color:var(--or-fonce);margin-top:-3px;line-height:1.2}
.mq-l{font-size:11.5px;font-weight:600;font-style:italic;color:var(--or-fonce);background:var(--or-pale);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* ---------- v2.3 : échange ---------- */
.bandeau-ech{display:flex;align-items:center;gap:10px;background:var(--or-pale);border:1.5px solid var(--or);border-radius:var(--r);padding:10px 13px;margin-bottom:9px;font-size:13px}
.bandeau-ech>div{flex:1;min-width:0}
.bandeau-ech span{color:var(--gris);font-size:12px}

/* ---------- v2.4 : crédits dans le panier ---------- */
.ligne-credit{background:#EEF7F1}
.ligne-credit .nom{color:var(--vert)}
.ligne-credit .tot{color:var(--vert)}
.barre-choix{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.barre-choix .btn{flex:1 1 45%;white-space:normal;line-height:1.25;font-size:14px}
.btn-ticket .btn{flex:1}

/* ---------- v2.4.2 : puces alignées, suppression de ligne ---------- */
.chips-wrap{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.chips-wrap>.chip{flex:0 0 auto}
.chips-wrap .chips{flex:1;margin:0;padding:0}
.btn-icon.suppr{width:34px;height:34px;flex:0 0 34px;background:transparent;color:var(--gris);font-size:15px}
.btn-icon.suppr:active{background:#FDECEA;color:var(--rouge)}

/* ---------- v2.5 : page Stock unique ---------- */
.actions-stock{display:flex;gap:8px;flex-wrap:wrap}
.actions-stock .btn{flex:1 1 auto}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.actions-fiche{display:flex;gap:8px;margin:4px 0 2px;padding-top:12px;border-top:1px solid var(--gris-clair)}
.actions-fiche .btn{flex:1}
@media(max-width:620px){.actions-stock{flex-direction:column}.actions-stock .btn{width:100%}}

/* ---------- v2.5.1 : annulation, panier compact sur téléphone ---------- */
.hd-act{display:flex;gap:6px;align-items:center}
.btn-annuler{background:var(--or-pale);color:var(--or-fonce);border:1.5px solid var(--or);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.toast-ann{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h,calc(64px + env(safe-area-inset-bottom,0px))) + 96px);z-index:1200;background:var(--anthracite);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--ombre-f);font-size:14px;max-width:92vw}
.toast-ann span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-ann button{background:var(--or);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
@media(min-width:901px){.toast-ann{bottom:28px}}

  .panier .ligne{flex-wrap:nowrap!important;gap:6px;padding:9px 12px}
  .panier .ligne .info{flex:1 1 auto!important;min-width:0}
  .panier .ligne .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .panier .ligne .det{font-size:11.5px}
  .panier .ligne .qte{gap:2px}
  .panier .ligne .qte button{width:28px;height:28px;font-size:15px}
  .panier .ligne .qte span{min-width:18px;font-size:14px}
  .panier .ligne .tot{font-size:14px;min-width:52px;text-align:right}
  .panier .ligne .btn-remise{min-width:34px;width:34px;min-height:32px;padding:0;font-size:14px;margin-left:0!important}
  .panier .ligne .btn-icon.suppr{width:28px;height:28px;flex:0 0 28px}
  .btn-ticket{flex-wrap:nowrap}
  .btn-ticket .btn{flex:1 1 0;min-width:0}
}

/* ---------- v2.5.2 : tailles sur téléphone ---------- */
.modal{overflow-x:hidden}
@media(max-width:620px){
  .modal .btn{white-space:normal}
  .modal-ft{flex-direction:column-reverse;gap:8px}
  .modal-ft .btn{width:100%;flex:none}
  .actions-stock{display:grid!important;grid-template-columns:1fr 1fr;flex-direction:initial}
  .actions-stock .btn:first-child{grid-column:1/-1}
  .actions-stock .btn{width:auto!important}
  .kpis.k3{gap:6px}
}

/* ---------- v2.5.3 : aucune grille ne déborde sur téléphone ---------- */
.kpis{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{min-width:0}
.kpi .v{overflow-wrap:anywhere}
.tabs button{min-width:0}
@media(max-width:620px){
  .actions-stock{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .actions-stock .btn{min-width:0;white-space:normal;padding:12px 8px;font-size:15px;line-height:1.2}
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .l{overflow-wrap:anywhere}
  .tabs{flex-wrap:wrap}
  .tabs button{flex:1 1 0;white-space:normal;padding:9px 6px}
  .barre-panier .btn.xl{flex:0 0 auto;min-width:0}
  .barre-panier .info{min-width:0}
}

/* ---------- v2.5.3 : tickets repliables ---------- */
#cartetk .tk-corps{display:none}
#cartetk.ouvert .tk-corps{display:block}

/* ---------- v2.5.5 : panier collé au-dessus du menu, sans calcul de position ---------- */
@media(max-width:900px){
  #vue{display:flex;flex-direction:column}
  #vue > .caisse{display:flex;flex-direction:column;align-items:stretch;flex:1 0 auto;width:100%;padding-bottom:0!important;box-sizing:border-box}
  #vue > .caisse > div:first-child{flex:1 0 auto}
  #vue > .caisse > .panier{position:sticky!important;bottom:0!important;left:auto;right:auto;margin:auto -12px 0;z-index:600}
  #vue > .caisse > .panier .lignes{max-height:45vh;overflow-y:auto}
}

/* ---------- v2.5.7 : toutes les pages en pleine largeur sur téléphone ---------- */
@media(max-width:900px){
  #vue > *{width:100%;max-width:100%;box-sizing:border-box;flex-shrink:0}
  #vue > .page{min-width:0}
  .periode .tabs button{padding:8px 4px;white-space:nowrap;min-width:0}
}

#planche{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}

.etq .en{font-size:11px;font-weight:700;margin-bottom:1mm}
.etq .ep{font-size:13px;font-weight:700}

function demarrerFirebase(){

const col=n=>db.collection('boutiques').doc(S.bid).collection(n);
const docParams=()=>db.collection('boutiques').doc(S.bid).collection('parametres').doc('general');

async function chargerRole(){
  const ref=col('comptes').doc(S.user.uid);
  const d=await ref.get();
  if(d.exists){S.role=d.data().role||'caisse';return}
  const tous=await col('comptes').limit(1).get();
  const premier=tous.empty;
  await ref.set({email:S.user.email,role:premier?'admin':'caisse',cree:new Date().toISOString()});
  S.role=premier?'admin':'caisse';
}

function ecoutes(){
  unsub.forEach(f=>f());unsub=[];
  unsub.push(col('produits').onSnapshot(s=>{
    S.produits=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!S.vendeur)return;
    if(S.page==='caisse'&&document.getElementById('grille'))dessinerGrille();else if(!invActif)rendre();
  },e=>toast('Lecture produits : '+e.code,'ko')));
  unsub.push(col('utilisateurs').onSnapshot(async s=>{
    S.users=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!S.users.length&&S.role==='admin')await semerUtilisateurs();
    if(S.vendeur)rendre();else demarrerApp();
  },e=>toast('Lecture utilisateurs : '+e.code,'ko')));
  unsub.push(docParams().onSnapshot(d=>{S.params=d.exists?d.data():{};
    if(S.vendeur&&S.page!=='caisse'&&!invActif)rendre()}));
  demarrerApp();
}
let semeEnCours=false,semeEchec=false;
async function semerUtilisateurs(){
  if(semeEnCours||semeEchec)return;
  semeEnCours=true;
  try{
    const b=db.batch();
    VENDEURS_INIT.forEach(v=>b.set(col('utilisateurs').doc(slug(v.nom)),{
      nom:v.nom,role:v.role,actif:true}));
    await b.commit();
  }catch(e){
    semeEchec=true;
    if(e&&e.code==='permission-denied')ecranBloque();
    else toast('Initialisation impossible : '+(e.code||e.message),'ko');
  }finally{semeEnCours=false}
}

function ecranConfig(err){
  APP().innerHTML=`<div class="pinwrap"><div class="marque">ANAQA SHOP</div><div class="sous">Mode Orientale</div>
   <div class="card" style="max-width:520px;width:100%;text-align:left">
    <h3>Connexion \u00e0 Firebase</h3>
    <p class="muted">Colle ici l\u2019objet <b>firebaseConfig</b> de ton projet Firebase (Console \u2192 Param\u00e8tres du projet \u2192 Tes applications \u2192 Web).</p>
    ${err?`<p style="color:var(--rouge);font-weight:600">${esc(err)}</p>`:''}
    <label class="field"><span>Identifiant boutique</span><input type="text" id="cbid" value="${esc(S.bid)}"></label>
    <label class="field"><span>firebaseConfig</span><textarea id="ccfg" rows="9" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea></label>
    <button class="btn xl" style="width:100%" onclick="validerConfig()">Enregistrer</button>
   </div></div>`;
}
function validerConfig(){
  let t=$('#ccfg').value;
  // tolère le bloc complet copié depuis la console Firebase (imports, commentaires, initializeApp…)
  t=t.replace(/\/\*[\s\S]*?\*\//g,'').replace(/^\s*\/\/.*$/gm,'');
  const m=t.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})\s*;?/);
  if(m)t=m[1];
  else{const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1)}
  t=t.trim();
  let cfg=null;
  try{cfg=JSON.parse(t)}catch(e){
    try{cfg=JSON.parse(t.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,(\s*[}\]])/g,'$1'))}
    catch(e2){cfg=null}
  }
  if(!cfg){
    const g=k=>{const r=t.match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'));return r?r[1]:''};
    const o={apiKey:g('apiKey'),authDomain:g('authDomain'),projectId:g('projectId'),
      storageBucket:g('storageBucket'),messagingSenderId:g('messagingSenderId'),appId:g('appId')};
    if(o.apiKey&&o.projectId)cfg=o;
  }
  if(!cfg)return toast('Format non reconnu — colle le bloc firebaseConfig','ko');
  delete cfg.measurementId;
  if(!cfg.apiKey||!cfg.projectId)return toast('apiKey ou projectId manquant','ko');
  localStorage.setItem('ANAQA_FB',JSON.stringify(cfg));
  localStorage.setItem('ANAQA_BID',$('#cbid').value.trim()||BID_DEF);
  location.reload();
}

function mesurerMenu(){
  const n=document.querySelector('nav.bottom');if(!n)return;
  const r=n.getBoundingClientRect(),vh=window.innerHeight||document.documentElement.clientHeight;
  // distance entre le haut du menu et le bas de l'\u00e9cran : couvre la marge de la barre d'accueil de l'iPhone
  const h=Math.ceil(Math.max(r.height,vh-r.top));
  if(h>0&&h<vh/2)document.documentElement.style.setProperty('--nav-h',h+'px');
  if(window.ResizeObserver&&!mesurerMenu.obs){mesurerMenu.obs=new ResizeObserver(()=>requestAnimationFrame(mesurerMenu))}
  if(mesurerMenu.obs&&mesurerMenu.cible!==n){mesurerMenu.obs.disconnect();mesurerMenu.obs.observe(n);mesurerMenu.cible=n}
}

/* ============ CR\u00c9DITS : retour d'\u00e9change et avoirs utilis\u00e9s dans le panier ============ */
function avoirsPanier(){return S.avoirsPanier||(S.avoirsPanier=[])}
function creditsTotal(){return +((S.echange?S.echange.credit:0)+avoirsPanier().reduce((s,a)=>s+a.montant,0)).toFixed(2)}
function aRegler(){return +(totaux().net-creditsTotal()).toFixed(2)}
function aDesCredits(){return !!S.echange||avoirsPanier().length>0}
function libMode(m){return({CB:'Carte',ESP:'Esp\u00e8ces',AVOIR:'Avoir',ECHANGE:'\u00c9change'})[m]||m}
/* R\u00e9partition : le cr\u00e9dit d'\u00e9change se consomme d'abord, puis les avoirs dans l'ordre */
function planCredits(){
  let N=+totaux().net.toFixed(2);
  const C=S.echange?+S.echange.credit.toFixed(2):0;
  const usedE=+Math.min(N,C).toFixed(2);N=+(N-usedE).toFixed(2);
  const avs=avoirsPanier().map(a=>{const u=+Math.min(N,a.montant).toFixed(2);N=+(N-u).toFixed(2);return {num:a.num,montant:a.montant,used:u,reliquat:+(a.montant-u).toFixed(2)}});
  return {usedE,exE:+(C-usedE).toFixed(2),avs,exA:+avs.reduce((s,a)=>s+(a.used>0?a.reliquat:0),0).toFixed(2),D:N};
}

  col('avoirs').where('utilise','==',false).get().then(s=>{

      ${l.map(a=>`<option value="${esc(a.num)}">${esc(a.num)} \u00b7 ${eur(a.montant)} \u00b7 ${dateFr(a.date)}</option>`).join('')}</select></label>
      <div class="defligne"><input type="text" id="avnum" placeholder="ou saisir / scanner le num\u00e9ro" autocomplete="off">
        <button class="btn" onclick="ajouterAvoirPanier()">Ajouter</button></div>
      <p id="averr" style="color:var(--rouge);font-weight:600;margin-top:8px"></p>
      ${l.length?'':'<p class="muted">Aucun avoir en cours.</p>'}`;

async function ajouterAvoirPanier(){
  const num=(($('#avnum')||{}).value||'').trim().toUpperCase(),err=$('#averr');
  if(!num)return;
  if(avoirsPanier().some(a=>a.num===num)){if(err)err.textContent='Cet avoir est d\u00e9j\u00e0 dans le panier.';return}
  try{
    const d=await col('avoirs').doc(num).get();
    if(!d.exists){if(err)err.textContent='Avoir introuvable.';return}
    const a=d.data();
    if(a.utilise){if(err)err.textContent='Cet avoir a d\u00e9j\u00e0 \u00e9t\u00e9 utilis\u00e9'+(a.venteUtilisation?' (ticket '+a.venteUtilisation+')':'')+'.';return}
    avoirsPanier().push({num:a.num||num,montant:+a.montant||0});
    fermer();toast('Avoir de '+eur(a.montant)+' ajout\u00e9','ok');
    const p=$('#panier');if(p&&window.innerWidth<=900){panierOuvert=true;p.classList.remove('replie')}
    dessinerPanier();
  }catch(e){if(err)err.textContent='Erreur : '+(e.code||e.message)}
}

     <label class="field" style="margin-top:12px"><span>Esp\u00e8ces re\u00e7ues <span class="muted">(facultatif, pour le rendu)</span></span>

function activerValider(ok){const b=$('#btnVal');if(b)b.disabled=!ok}
function calcRendu(){
  const net=aRegler(),r=+$('#recu').value||0,z=$('#rendu');
  const ok=r>=net-0.001;
  z.innerHTML=`<div class="l">Rendu monnaie</div><div class="v" style="color:${ok?'var(--vert)':'var(--gris)'}">${ok?eur(r-net):'\u2014'}</div>
    ${$('#recu').value!==''&&!ok?`<div class="d" style="color:var(--rouge)">Il manque ${eur(net-r)}</div>`:''}`;
  activerValider(ok);
}
function calcMix(src){
  const net=aRegler();
  const icb=$('#pcb'),iesp=$('#pesp'),note=$('#mixnote');
  let msg='';
  if(src==='cb'&&icb.value!==''){
    let cb=+icb.value||0;
    if(cb>net){cb=net;icb.value=net.toFixed(2);msg='Part carte plafonn\u00e9e au montant \u00e0 r\u00e9gler.'}
    if(cb<0){cb=0;icb.value='0'}
    iesp.value=Math.max(0,+(net-cb).toFixed(2));
  }
  if(src==='esp'&&iesp.value!==''){
    let esp=+iesp.value||0;
    if(esp>net){esp=net;iesp.value=net.toFixed(2);msg='Part esp\u00e8ces plafonn\u00e9e au montant \u00e0 r\u00e9gler.'}
    if(esp<0){esp=0;iesp.value='0'}
    icb.value=Math.max(0,+(net-esp).toFixed(2));
  }
  if(note&&src)note.textContent=msg;
  const cb=+icb.value||0,esp=+iesp.value||0;
  const reste=+(net-cb-esp).toFixed(2),equilibre=Math.abs(reste)<0.01;
  $('#mixinfo').innerHTML=`<div class="l">Reste \u00e0 r\u00e9partir</div><div class="v" style="color:${equilibre?'var(--vert)':'var(--rouge)'}">${eur(reste)}</div>`;
  const ir=$('#recumix'),zr=$('#rendumix');
  let recuOk=true;
  if(ir&&zr){
    if(ir.value===''||esp<=0){zr.style.display='none'}
    else{
      const recu=+ir.value||0;recuOk=recu>=esp-0.001;
      zr.style.display='';
      zr.innerHTML=recuOk
        ?`<div class="l">Rendu monnaie</div><div class="v" style="color:var(--vert)">${eur(recu-esp)}</div>`
        :`<div class="l">Esp\u00e8ces re\u00e7ues insuffisantes</div><div class="v" style="color:var(--rouge)">il manque ${eur(esp-recu)}</div>`;
    }
  }
  activerValider(equilibre&&recuOk);
}
async function validerVente(){
  if(!S.panier.length)return;
  const net=aRegler();
  let regs=[],rendu=0;
  if(regMode==='CB')regs=[{mode:'CB',montant:net}];
  else if(regMode==='ESP'){const r=+($('#recu')||{}).value||0;if(r<net-0.001)return toast('Esp\u00e8ces re\u00e7ues insuffisantes','ko');regs=[{mode:'ESP',montant:net}];rendu=r-net}
  else{const cb=+$('#pcb').value||0,esp=+$('#pesp').value||0;
    if(Math.abs(cb+esp-net)>0.01)return toast('La r\u00e9partition ne correspond pas au total','ko');
    const rm=($('#recumix')||{}).value;if(rm&&esp>0&&(+rm)<esp-0.001)return toast('Esp\u00e8ces re\u00e7ues insuffisantes','ko');
    if(cb>0)regs.push({mode:'CB',montant:+cb.toFixed(2)});if(esp>0)regs.push({mode:'ESP',montant:+esp.toFixed(2)});
    if(rm&&esp>0)rendu=(+rm)-esp}
  const b=$('#btnVal');if(b){b.innerHTML='<span class="spin"></span>';b.disabled=true}
  finaliserVente(regs,null,rendu);
}

function solderCredit(mode){
  if(!S.panier.length)return toast('Ajoute au moins un article','ko');

  if(mode==='ESP'&&!confirm('Rendre '+eur(p.exE).replace(/\u00a0/g,' ')+' en esp\u00e8ces au client ?'))return;
  finaliserVente([],mode,0);
}
/* ---- \u00c9criture unique : vente, retour d'\u00e9change, avoirs consomm\u00e9s et nouvel avoir ---- */
function construireVente(t,regs){
  return {num:numTicket(),date:today(),ts:Date.now(),type:'VENTE',origine:'caisse',
    vendeur:S.vendeur.nom,vendeurId:S.vendeur.id,refs:S.panier.map(l=>l.ref),
    lignes:S.panier.map(l=>({ref:l.ref,nom:l.nom,marque:l.marque||'',qte:l.qte,pa:l.pa,pv:l.pv,remise:+l.remise||0,total:+(l.pv*l.qte-(+l.remise||0)).toFixed(2)})),
    remiseTicket:+S.remiseTicket||0,remiseTotale:+t.rem.toFixed(2),
    total:+t.net.toFixed(2),marge:+t.marge.toFixed(2),
    reglements:regs,mode:regs.length>1?'MIX':(regs[0]?regs[0].mode:'ECHANGE')};
}
function ecrireVente(batch,vente){
  batch.set(col('ventes').doc(vente.num),vente);
  ecrireResume(batch,vente);
  S.panier.forEach(l=>{
    batch.update(col('produits').doc(l.ref),{stock:firebase.firestore.FieldValue.increment(-l.qte)});
    batch.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:l.ref,nom:l.nom,type:'VENTE',qte:-l.qte,vendeur:S.vendeur.nom,com:vente.num});
  });
}
function finaliserVente(regsPaiement,modeSolde,rendu){
  const t=totaux(),p=planCredits(),E=S.echange;
  const batch=db.batch();
  const regs=[];
  if(E&&p.usedE>0)regs.push({mode:'ECHANGE',montant:p.usedE});
  p.avs.filter(a=>a.used>0).forEach(a=>regs.push({mode:'AVOIR',montant:a.used,avoir:a.num}));
  regs.push(...(regsPaiement||[]));
  const vente=construireVente(t,regs);
  // nouvel avoir unique : reliquat des avoirs + \u00e9ventuel exc\u00e9dent d'\u00e9change mis en avoir
  const exEAvoir=E&&p.exE>0.004&&modeSolde==='AVOIR'?p.exE:0;
  const exEEsp=E&&p.exE>0.004&&modeSolde!=='AVOIR'?p.exE:0;
  const nouveau=+(p.exA+exEAvoir).toFixed(2);
  let numAvoir=null;
  if(nouveau>0.004){numAvoir=creerAvoir(batch,nouveau,vente.num);vente.avoirReliquat=numAvoir;vente.avoirReliquatMontant=nouveau}
  if(E){
    const numRet=numTicket().replace('AN-','RET-');
    const regsRet=[];
    if(p.usedE>0)regsRet.push({mode:'ECHANGE',montant:-p.usedE});
    if(exEAvoir)regsRet.push({mode:'AVOIR',montant:-exEAvoir,avoir:numAvoir});
    if(exEEsp)regsRet.push({mode:'ESP',montant:-exEEsp});
    const ret=construireRetour(E.vente,E.lignes,numRet,'echange',regsRet,Object.assign({echange:vente.num},exEAvoir?{avoirEmis:numAvoir}:{}));
    vente.echangeRetour={num:numRet,venteOrigine:E.vente.num,credit:E.credit,
      lignes:E.lignes.map(x=>({nom:x.l.nom,qte:x.q,total:+(x.q*(x.l.total/x.l.qte)).toFixed(2)})),
      solde:exEAvoir||exEEsp?-(exEAvoir||exEEsp):+(p.D>0?p.D:0),soldeMode:exEAvoir?'AVOIR':(exEEsp?'ESP':null)};
    batch.set(col('ventes').doc(numRet),ret);
    ecrireResume(batch,ret);
    ecrireStockRetour(batch,E.lignes,numRet,E.vente);
  }
  p.avs.filter(a=>a.used>0).forEach(a=>batch.update(col('avoirs').doc(a.num),{utilise:true,venteUtilisation:vente.num}));
  ecrireVente(batch,vente);
  batch.commit().catch(e=>toast('Synchro diff\u00e9r\u00e9e : '+e.code,'ko'));
  S.ventesCache=null;S.resumesCache=null;fermer();
  apresVente(vente,(rendu||0)+(exEEsp||0),exEEsp);
  reinitialiserCaisse();
}

  d.line(3,y,55,y);y+=4;

    g(l.qte+' x '+eur(l.pv).replace(/[\u00a0\u202f]/g,' '),eur(l.total).replace(/[\u00a0\u202f]/g,' '));
    if(l.remise>0)g('  remise','-'+eur(l.remise).replace(/[\u00a0\u202f]/g,' '))});
  d.line(3,y,55,y);y+=4.5;
  if(v.remiseTicket>0)g('Remise ticket','-'+eur(v.remiseTicket).replace(/[\u00a0\u202f]/g,' '));
  d.setFont('courier','bold');d.setFontSize(9.5);g('TOTAL',eur(v.total).replace(/[\u00a0\u202f]/g,' '));
  d.setFont('courier','normal');d.setFontSize(7.5);
  const E=s=>eur(s).replace(/[\u00a0\u202f]/g,' ');
  (v.reglements||[]).forEach(r=>g(({CB:'Carte bancaire',ESP:'Especes',AVOIR:'Avoir',ECHANGE:'Credit echange'})[r.mode]||r.mode,E(r.montant)));
  if(v.echangeRetour){y+=1;d.line(3,y,55,y);y+=4;d.setFont('courier','bold');g('ECHANGE - rendus','');d.setFont('courier','normal');
    v.echangeRetour.lignes.forEach(l=>g(String(l.nom).slice(0,22)+' x'+l.qte,'-'+E(l.total)));
    g(v.echangeRetour.solde>=0?'Paye par le client':(v.echangeRetour.soldeMode==='AVOIR'?'Mis en avoir':'Rendu au client'),E(Math.abs(v.echangeRetour.solde)));
    if(v.echangeRetour.avoirEmis)g('Avoir '+v.echangeRetour.avoirEmis,'')}
  if(v.avoirReliquat){g('Nouvel avoir',E(v.avoirReliquatMontant));g('n. '+v.avoirReliquat,'')}
  if(v.avoirEmis)g('Avoir n. '+v.avoirEmis,'');
  y+=2;d.setFontSize(6.5);c('TVA non applicable, art. 293 B du CGI');c(P.mention||'Merci de votre visite');
  const nomFichier='Ticket_'+v.num+'.pdf';
  if(appareilTactile()&&navigator.canShare){
    try{
      const f=new File([d.output('blob')],nomFichier,{type:'application/pdf'});

}

function maxRetour(i){const l=retourSel.vente.lignes[i];return Math.max(0,(+l.qte||0)-(retourSel.deja[l.ref]||0))}
function dessinerLignesRetour(){
  const v=retourSel.vente;
  $('#rl').innerHTML=v.lignes.map((l,i)=>{
    const q=retourSel.lignes[i]||0,d=retourSel.deja[l.ref]||0,max=maxRetour(i);

      <div class="det">vendu ${l.qte} \u00d7 ${eur(l.pv)}${d?` \u00b7 <b style="color:var(--rouge)">d\u00e9j\u00e0 retourn\u00e9 ${d}</b>`:''}</div></div>
      ${max?`<div class="qte"><button onclick="majRetour(${i},-1)">\u2212</button><span>${q}</span><button onclick="majRetour(${i},1)">+</button></div>`
        :'<span class="pill nr">enti\u00e8rement retourn\u00e9</span>'}
      <div class="tot">${eur(q*(l.total/l.qte))}</div></div>`}).join('');
  let t=0;v.lignes.forEach((l,i)=>t+=(retourSel.lignes[i]||0)*(l.total/l.qte));

}
function majRetour(i,d){
  retourSel.lignes[i]=Math.max(0,Math.min(maxRetour(i),(retourSel.lignes[i]||0)+d));

}
function libellesReglements(v){
  const L={CB:'Carte',ESP:'Esp\u00e8ces',AVOIR:'Avoir',ECHANGE:'\u00c9change'};
  const r=(v.reglements||[]);return r.length?r.map(x=>L[x.mode]||x.mode).join(' + '):(L[v.mode]||'non renseign\u00e9');
}
function lignesRetourChoisies(){
  const v=retourSel.vente;
  return v.lignes.map((l,i)=>({l,q:Math.min(retourSel.lignes[i]||0,maxRetour(i))})).filter(x=>x.q>0);
}
function construireRetour(v,lignes,num,modeRetour,reglements,extra){
  const total=+lignes.reduce((s,x)=>s+x.q*(x.l.total/x.l.qte),0).toFixed(2);
  const marge=+lignes.reduce((s,x)=>s+x.q*((x.l.total/x.l.qte)-x.l.pa),0).toFixed(2);
  return Object.assign({num,date:today(),ts:Date.now(),type:'RETOUR',origine:'caisse',
    vendeur:S.vendeur.nom,vendeurId:S.vendeur.id,venteOrigine:v.num,modeRetour,
    refs:lignes.map(x=>x.l.ref),
    lignes:lignes.map(x=>({ref:x.l.ref,nom:x.l.nom,marque:x.l.marque||'',qte:-x.q,pa:x.l.pa,pv:x.l.pv,remise:0,total:-+(x.q*(x.l.total/x.l.qte)).toFixed(2)})),
    remiseTicket:0,remiseTotale:0,total:-total,marge:-marge,
    reglements,mode:reglements.length>1?'MIX':(reglements[0]?reglements[0].mode:'AVOIR')},extra||{});
}
function ecrireStockRetour(b,lignes,num,v){
  lignes.forEach(x=>{
    b.update(col('produits').doc(x.l.ref),{stock:firebase.firestore.FieldValue.increment(x.q)});
    b.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:x.l.ref,nom:x.l.nom,type:'RETOUR',qte:x.q,vendeur:S.vendeur.nom,com:num+' / '+v.num});
  });
}
function creerAvoir(b,montant,origine){
  const num=numTicket().replace('AN-','AV-');
  b.set(col('avoirs').doc(num),{num,montant:+(+montant).toFixed(2),date:today(),ts:Date.now(),origine,utilise:false,vendeur:S.vendeur.nom});
  return num;
}
async function validerRetour(){
  const v=retourSel.vente,mode=$('#rmode').value;
  const lignes=lignesRetourChoisies();
  if(!lignes.length)return toast('S\u00e9lectionne au moins un article','ko');
  const total=+lignes.reduce((s,x)=>s+x.q*(x.l.total/x.l.qte),0).toFixed(2);
  if(mode==='echange'){
    S.echange={vente:v,lignes,credit:total};
    S.q='';S.cat='Tous';panierOuvert=true;
    fermer();toast('\u00c9change : ajoute les nouveaux articles','ok');aller('caisse');
    return;
  }
  const num=numTicket().replace('AN-','RET-');
  const b=db.batch();
  let regs=[],avoirNum=null;
  if(mode==='remb_esp')regs=[{mode:'ESP',montant:-total}];
  else if(mode==='remb_cb')regs=[{mode:'CB',montant:-total}];
  else{avoirNum=creerAvoir(b,total,num);regs=[{mode:'AVOIR',montant:-total,avoir:avoirNum}]}
  const ret=construireRetour(v,lignes,num,mode==='avoir'?'avoir':'remboursement',regs,avoirNum?{avoirEmis:avoirNum}:{});
  b.set(col('ventes').doc(num),ret);
  ecrireResume(b,ret);
  ecrireStockRetour(b,lignes,num,v);
  b.commit().catch(e=>toast('Synchro diff\u00e9r\u00e9e : '+e.code,'ko'));
  S.ventesCache=null;S.resumesCache=null;fermer();
  dernierTicket=ret;
  modale(`<h2 style="color:var(--vert)">\u2713 Retour enregistr\u00e9</h2>
   <div class="kpi"><div class="l">${avoirNum?'Avoir n\u00b0 '+esc(avoirNum):(mode==='remb_cb'?'Remboursement sur carte':'Remboursement en esp\u00e8ces')}</div><div class="v">${eur(total)}</div>

   <button class="btn xl" style="width:100%" onclick="fermer();aller('retour')">Terminer</button>`);
}

  const cats=ordreCats().concat([...new Set(S.produits.map(x=>x.cat).filter(Boolean))]).filter((v,i,a)=>a.indexOf(v)===i);
  const mqs=listeMarques();if(p.marque&&!mqs.includes(p.marque))mqs.push(p.marque);
  modale(`<h2>${id?'Modifier':'Nouveau produit'}</h2>
   <label class="field"><span>1. Cat\u00e9gorie</span>
     <select id="ec" onchange="changerCat()">${['',...cats].map(c=>`<option value="${esc(c)}" ${p.cat===c?'selected':''}>${c?esc(c):'\u2014 choisir \u2014'}</option>`).join('')}
       <option value="__new">+ Nouvelle cat\u00e9gorie\u2026</option></select></label>
   <label class="field hidden" id="wnc"><span>Nom de la nouvelle cat\u00e9gorie</span><input type="text" id="enc" placeholder="Ex. Maroquinerie"></label>
   <label class="field"><span>2. Nom / r\u00e9f\u00e9rence <span class="muted">(choisis un produit existant pour reprendre ses prix)</span></span>
     <input type="text" id="en" list="lnoms" value="${esc(p.nom)}" ${id?'':'autofocus'} oninput="prefillProduit()">
     <datalist id="lnoms"></datalist></label>
   <label class="field"><span>3. Marque <span class="muted">(facultatif)</span></span>
     <select id="emq" onchange="changerMarque()"><option value="">\u2014 aucune \u2014</option>
       ${mqs.sort((a,b)=>a.localeCompare(b,'fr',{sensitivity:'base'})).map(m=>`<option value="${esc(m)}" ${p.marque===m?'selected':''}>${esc(m)}</option>`).join('')}
       <option value="__new">+ Nouvelle marque\u2026</option></select></label>
   <label class="field hidden" id="wnm"><span>Nom de la nouvelle marque</span><input type="text" id="enm" oninput="prefillProduit()"></label>
   <div id="alertedbl"></div>
   <div class="row"><label class="field"><span>Prix d\u2019achat</span><input type="number" id="epa" step="0.5" value="${p.pa||0}"></label>
    <label class="field"><span>Prix de vente</span><input type="number" id="epv" step="0.5" value="${p.pv||0}"></label></div>
   <div class="row"><label class="field"><span>Stock</span><input type="number" id="est" value="${p.stock||0}" ${id?'disabled':''}></label>
    <label class="field"><span>Seuil d\u2019alerte</span><input type="number" id="ese" value="${p.seuil||0}"></label></div>
   ${id?'<p class="muted">Le stock se modifie depuis l\u2019onglet Stock (entr\u00e9e en stock ou inventaire), ce qui met aussi la date et le prix moyen \u00e0 jour.</p>':''}
   <div class="row">
     <label class="field"><span>Entr\u00e9e en stock</span>
       <span class="date-wrap" style="display:flex"><button class="btn ghost" tabindex="-1" type="button" style="width:100%;min-width:0">${dateCourt(p.dateEntree||today())}</button>
         <input type="date" id="ede" value="${p.dateEntree||today()}" onchange="if(this.value)this.previousElementSibling.textContent=dateCourt(this.value)"></span></label>
     <label class="field"><span>Code-barres</span><input type="text" id="ecb" value="${esc(p.codeBarre||'')}">
       <small class="muted" style="display:block;margin-top:3px;font-size:11px">vide = nom et marque servent de code</small></label></div>
   <div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="efa" ${p.favori?'checked':''} style="width:auto"> Favori en caisse</label>
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="eac" ${p.actif!==false?'checked':''} style="width:auto"> Actif</label></div>
   ${id?`<div class="actions-fiche">
     <button class="btn ghost" onclick="fermer();mouvementStock('ENTREE',{cat:'${esc(p.cat||'').replace(/'/g,'')}',prod:'${id}'})">+ Entr\u00e9e en stock</button>
     <button class="btn ghost" onclick="fermer();mouvementStock('INVENTAIRE',{cat:'${esc(p.cat||'').replace(/'/g,'')}',prod:'${id}'})">Corriger le stock</button></div>`:''}
   ${S.role==='admin'?'':'<p class="muted" style="margin-top:8px">Modification de la fiche r\u00e9serv\u00e9e \u00e0 l\u2019appareil administrateur.</p>'}

let ficheEnCours=null;
function changerCat(){
  const s=$('#ec'),w=$('#wnc');
  if(s.value==='__new'){w.classList.remove('hidden');const i=$('#enc');if(i)i.focus()}
  else w.classList.add('hidden');
  majListeNoms();
}
function changerMarque(){
  const s=$('#emq'),w=$('#wnm');
  if(s.value==='__new'){w.classList.remove('hidden');const i=$('#enm');if(i)i.focus()}
  else w.classList.add('hidden');
  prefillProduit();
}
function majuscule(s){s=String(s||'').trim();return s?s.charAt(0).toLocaleUpperCase('fr-FR')+s.slice(1):s}
function catSaisie(){
  const s=$('#ec');if(!s)return '';
  return s.value==='__new'?majuscule(($('#enc')||{}).value||''):s.value.trim();
}
function marqueSaisie(){
  const s=$('#emq');if(!s)return '';
  const v=s.value==='__new'?majuscule(($('#enm')||{}).value||''):s.value.trim();
  return canonMarque(v);
}
function majListeNoms(){
  const c=catSaisie(),d=$('#lnoms');if(!d)return;
  const noms=[...new Set(S.produits.filter(p=>!c||p.cat===c).map(p=>p.nom))].sort((a,b)=>a.localeCompare(b,'fr'));
  d.innerHTML=noms.map(n=>`<option value="${esc(n)}"></option>`).join('');
}
function prefillProduit(){
  const nom=($('#en').value||'').trim().toLowerCase(),z=$('#alertedbl');
  const mq=marqueSaisie().toLowerCase();
  const memeNom=S.produits.filter(x=>x.nom.toLowerCase()===nom&&x.id!==ficheEnCours);
  if(!memeNom.length){if(z)z.innerHTML='';return}
  const exact=memeNom.find(x=>(x.marque||'').toLowerCase()===mq);
  const src=exact||memeNom[0];
  if(!ficheEnCours){
    $('#epa').value=src.pa||0;$('#epv').value=src.pv||0;$('#ese').value=src.seuil||0;
    if($('#ec')&&src.cat&&$('#ec').value!=='__new')$('#ec').value=src.cat;
  }
  if(!z)return;
  z.innerHTML=exact
    ?`<div class="card" style="background:#FDECEA;box-shadow:none;padding:10px 12px;margin-bottom:12px">
       <b>${esc(nomComplet(exact))}</b> existe d\u00e9j\u00e0 (stock ${nb(exact.stock||0)}).
       <button class="btn ghost sm" style="margin-top:8px" onclick="fermer();editerProduit('${exact.id}')">Ouvrir la fiche existante</button></div>`
    :`<div class="card" style="background:var(--or-pale);box-shadow:none;padding:10px 12px;margin-bottom:12px">
       ${ficheEnCours?'':'Prix repris de <b>'+esc(nomComplet(src))+'</b>. '}Ce produit existe en : ${memeNom.map(x=>esc(x.marque||'sans marque')).join(', ')}.</div>`;
}
async function sauverProduit(id){
  const nom=majuscule($('#en').value);if(!nom)return toast('Nom obligatoire','ko');
  const cat=catSaisie();if(!cat)return toast('Cat\u00e9gorie obligatoire','ko');
  const marque=marqueSaisie();
  const libelle=nom+(marque?' '+marque:'');
  const dbl=S.produits.find(p=>p.id!==id&&p.nom.toLowerCase()===nom.toLowerCase()&&(p.marque||'').toLowerCase()===marque.toLowerCase());
  if(dbl)return toast('\u00ab '+nomComplet(dbl)+' \u00bb existe d\u00e9j\u00e0 \u2014 ouvre sa fiche','ko');
  const d={nom,cat,marque,pa:+$('#epa').value||0,pv:+$('#epv').value||0,
    seuil:+$('#ese').value||0,codeBarre:$('#ecb').value.trim()||libelle,
    dateEntree:$('#ede').value||today(),
    favori:$('#efa').checked,actif:$('#eac').checked,maj:Date.now()};
  try{
    if(id)await col('produits').doc(id).update(d);
    else{
      const nid=slug(libelle);
      if(S.produits.find(p=>p.id===nid))return toast('Ce produit existe d\u00e9j\u00e0 \u2014 ouvre sa fiche','ko');
      d.stock=+$('#est').value||0;
      await col('produits').doc(nid).set(d);
      if(d.stock)await col('mouvements').add({ts:Date.now(),date:d.dateEntree,ref:nid,nom:nomComplet(d),type:'ENTREE',qte:d.stock,vendeur:S.vendeur?S.vendeur.nom:'',com:'Cr\u00e9ation de fiche'});
    }
    await ajouterMarqueListe(marque);
    fermer();toast('Produit enregistr\u00e9','ok');
  }catch(e){toast('Refus\u00e9 : '+(e.code||e.message),'ko')}
}

/* ---- Doublons ---- */
function cleNom(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function cleProd(p){return cleNom(p.nom)+'|'+cleNom(p.marque||'')}
function groupesDoublons(){
  const m={};S.produits.forEach(p=>{const k=cleProd(p);(m[k]=m[k]||[]).push(p)});
  // un groupe n'est un doublon que s'il reste au moins deux fiches actives
  return Object.values(m).filter(g=>g.filter(p=>p.actif!==false).length>1);
}
function vueDoublons(){
  const gs=groupesDoublons();
  modale(`<h2>Doublons d\u00e9tect\u00e9s</h2>
   ${gs.length?`<p class="muted">Choisis la fiche \u00e0 conserver. Les stocks sont additionn\u00e9s, les autres fiches passent en inactif \u2014 rien n\u2019est supprim\u00e9 et l\u2019historique des ventes reste intact.</p>
   ${gs.map((g,i)=>`<div class="card" style="box-shadow:none;border:1px solid var(--gris-clair)">
     <h3>${esc(nomComplet(g[0]))} \u2014 ${g.length} fiches</h3>
     ${g.map(p=>`<div class="ligne"><div class="info"><div class="nom">${esc(p.nom)}</div>
       <div class="det">${esc(p.cat||'')} \u00b7 PA ${eur(p.pa)} \u00b7 PV ${eur(p.pv)} \u00b7 stock ${nb(p.stock||0)}${p.actif===false?' \u00b7 inactif':''}</div></div>
       ${p.actif===false?'<span class="pill nr">d\u00e9j\u00e0 fusionn\u00e9e</span>'
         :`<button class="btn sm" onclick="fusionner('${cleProd(p).replace(/'/g,'')}','${p.id}')">Garder celle-ci</button>`}</div>`).join('')}
   </div>`).join('')}`:'<p class="muted">Aucun doublon.</p>'}
   <div class="modal-ft"><button class="btn ghost" onclick="fermer()">Fermer</button></div>`,'lg');
}
async function fusionner(cle,gardeId){
  const g=S.produits.filter(p=>cleProd(p).replace(/'/g,'')===cle);
  const garde=g.find(p=>p.id===gardeId);if(!garde)return;
  const autres=g.filter(p=>p.id!==gardeId&&p.actif!==false);
  const stock=g.filter(p=>p.actif!==false).reduce((s,p)=>s+(+p.stock||0),0);
  if(!confirm('Conserver \u00ab '+garde.nom+' \u00bb avec un stock de '+stock+', et d\u00e9sactiver '+autres.length+' fiche(s) ?'))return;
  try{
    const b=db.batch();
    b.update(col('produits').doc(gardeId),{stock,actif:true,maj:Date.now()});
    autres.forEach(p=>b.update(col('produits').doc(p.id),{actif:false,favori:false,fusionneVers:gardeId,maj:Date.now()}));
    autres.forEach(p=>b.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:p.id,nom:p.nom,type:'FUSION',qte:-(+p.stock||0),vendeur:S.vendeur?S.vendeur.nom:'',com:'Fusionn\u00e9 vers '+garde.nom}));
    await b.commit();
    fermer();toast('Fiches fusionn\u00e9es','ok');vueProduits();
  }catch(e){toast('Refus\u00e9 : '+(e.code||e.message),'ko')}
}

/* ---- Etiquettes code-barres ---- */
function ouvrirEtiquettes(){
  modale(`<h2>Planche d\u2019\u00e9tiquettes</h2>
   <p class="muted">Coche les produits, indique le nombre d\u2019\u00e9tiquettes, puis imprime. Format Code\u00a0128, lisible par toute douchette.</p>
   <input type="text" id="eq" placeholder="Filtrer\u2026" style="margin:10px 0" oninput="listeEtq()">
   <div id="elist" style="max-height:44vh;overflow-y:auto"></div>
   <div class="modal-ft"><button class="btn ghost" onclick="fermer()">Fermer</button>
    <button class="btn" onclick="imprimerEtiquettes()">Imprimer</button></div>`,'lg');
  listeEtq();
}
function listeEtq(){
  const q=(($('#eq')||{}).value||'').toLowerCase();
  $('#elist').innerHTML=S.produits.filter(p=>p.actif!==false&&(!q||p.nom.toLowerCase().includes(q)))
    .sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).slice(0,200)
    .map(p=>`<div class="ligne"><label style="flex:1;display:flex;gap:9px;align-items:center">
      <input type="checkbox" class="ecb" value="${p.id}" style="width:auto"> <b>${esc(nomComplet(p))}</b>
      <span class="muted">${eur(p.pv)}</span></label>
      <input type="number" class="eqt" data-id="${p.id}" value="1" min="1" style="width:66px"></div>`).join('');
}
function imprimerEtiquettes(){
  const sel=[...document.querySelectorAll('.ecb:checked')].map(c=>c.value);
  if(!sel.length)return toast('Aucun produit s\u00e9lectionn\u00e9','ko');
  let html='';
  sel.forEach(id=>{
    const p=S.produits.find(x=>x.id===id);
    const n=+document.querySelector('.eqt[data-id="'+id+'"]').value||1;
    for(let i=0;i<n;i++)html+=`<div class="etq"><div class="en">${esc(nomComplet(p))}</div>
      <svg class="bc" data-code="${esc(p.codeBarre||p.nom)}"></svg><div class="ep">${eur(p.pv)}</div></div>`;
  });
  const z=document.getElementById('planche');z.innerHTML=html;z.classList.remove('hidden');
  z.querySelectorAll('.bc').forEach(s=>{try{JsBarcode(s,s.dataset.code,{format:'CODE128',width:1.5,height:38,fontSize:11,margin:2})}catch(e){}});
  fermer();
  setTimeout(()=>{window.print();setTimeout(()=>z.classList.add('hidden'),400)},250);
}

/* ============ STOCK ============ */
let stockOuvert={neg:false,appro:false,mvt:false};
function vueStock(){
  const admin=S.role==='admin';
  const actifs=S.produits.filter(p=>p.actif!==false);
  const alertes=actifs.filter(p=>+p.seuil>0&&(+p.stock||0)<=+p.seuil).sort((a,b)=>(+a.stock||0)-(+b.stock||0));
  const valeur=S.produits.reduce((s,p)=>s+Math.max(0,+p.stock||0)*(+p.pa||0),0);
  const negs=S.produits.filter(p=>(+p.stock||0)<0).sort((a,b)=>(+a.stock||0)-(+b.stock||0));
  const dbl=groupesDoublons().length;
  const q=pq.trim().toLowerCase();
  const filtre=p=>!q||(p.nom+' '+(p.marque||'')+' '+(p.cat||'')).toLowerCase().includes(q);
  const groupes=categoriesProduits().map(c=>({c,l:S.produits.filter(p=>(p.cat||'')===c&&filtre(p))
    .sort((a,b)=>a.nom.localeCompare(b.nom,'fr')||(a.marque||'').localeCompare(b.marque||'','fr'))})).filter(g=>g.l.length);
  const replie=(cle,titre,couleur,corps)=>`<div class="card"${couleur?` style="border-left:4px solid ${couleur}"`:''}>
     <div class="repli-hd" onclick="stockOuvert.${cle}=!stockOuvert.${cle};vueStock()">
       <h3${couleur?` style="color:${couleur}"`:''}>${titre}</h3>
       <span class="fleche-panier" style="display:inline-flex">${stockOuvert[cle]?'\u25B2':'\u25BC'}</span></div>
     ${stockOuvert[cle]?`<div style="margin-top:12px">${corps()}</div>`:''}</div>`;
  const listeGroupes=()=>groupes.length?groupes.map(g=>{
      const ouvert=!!q||catsOuvertes.has(g.c);
      const sansPrix=g.l.filter(p=>!p.pv).length,ng=g.l.filter(p=>(+p.stock||0)<0).length;
      const al=[sansPrix?sansPrix+' sans prix':'',ng?ng+' n\u00e9gatif'+(ng>1?'s':''):''].filter(Boolean).join(' \u00b7 ');
      return `<div class="grp-prod">
        <div class="grp-hd" onclick="basculerCatProduits('${esc(g.c).replace(/'/g,'')}')">
          <span class="grp-fl">${ouvert?'\u25BC':'\u25B6'}</span>
          <b>${esc(g.c||'Sans cat\u00e9gorie')}</b><span class="muted">(${g.l.length})</span>
          ${al?`<span class="grp-al">${al}</span>`:''}</div>
        ${ouvert?`<div style="overflow-x:auto"><table class="mob"><thead><tr><th>Produit</th>
          <th class="tright">PV</th><th class="tright">Stock</th><th>Entr\u00e9e</th><th>Fav</th><th></th></tr></thead><tbody>
          ${g.l.map(ligneProduit).join('')}</tbody></table></div>`:''}
      </div>`}).join(''):'<p class="muted">Aucun produit.</p>';
  $('#vue').innerHTML=`<div class="page">
   <div class="kpis k3">
     <div class="kpi"><div class="l">Valeur du stock</div><div class="v">${eur(valeur)}</div></div>
     <div class="kpi"><div class="l">Sous le seuil</div><div class="v" style="color:${alertes.length?'var(--rouge)':'var(--vert)'}">${alertes.length}</div></div>
     <div class="kpi"><div class="l">R\u00e9f\u00e9rences</div><div class="v">${actifs.length}</div></div></div>
   <div class="card">
     <div class="actions-stock">
       <button class="btn" onclick="mouvementStock('ENTREE')">+ Entr\u00e9e en stock</button>
       <button class="btn ghost" onclick="ouvrirInventaire()">\u{1F4CB} Inventaire</button>
       <button class="btn ghost" onclick="ouvrirEtiquettes()">\u{1F3F7} \u00c9tiquettes</button></div>
   </div>
   <div class="card">
    <div class="searchbar"><span class="searchwrap"><input type="text" id="pq" placeholder="Rechercher\u2026" value="${esc(pq)}" autocomplete="off">
      ${pq?'<button class="clr" title="Effacer" onclick="pq=\'\';vueStock()">\u2715</button>':''}</span>
     ${admin?'<button class="btn ghost" onclick="editerProduit()">+ Nouveau produit</button>':''}</div>
    ${q?`<p class="muted" style="margin-bottom:8px">${groupes.reduce((s,g)=>s+g.l.length,0)} r\u00e9sultat(s)</p>${listeGroupes()}`:''}
   </div>
   ${q?'':`
   ${negs.length?replie('neg','\u26a0 Stocks n\u00e9gatifs ('+negs.length+')','var(--rouge)',()=>`
     <p class="muted" style="margin-bottom:8px">Articles vendus sans avoir \u00e9t\u00e9 entr\u00e9s en stock. Ouvre un produit pour le corriger.</p>

function chargerMouvements(){
  col('mouvements').orderBy('ts','desc').limit(30).get().then(s=>{
    const z=$('#mvts');if(!z)return;
    if(s.empty)return z.innerHTML='<p class="muted">Aucun mouvement</p>';
    z.innerHTML=`<table class="mob"><thead><tr><th>Produit</th><th>Date</th><th>Type</th><th class="tright">Qt\u00e9</th><th>Par</th></tr></thead><tbody>
      ${s.docs.map(d=>d.data()).map(m=>`<tr><td><b>${esc(m.nom)}</b></td>
      <td data-l="Date">${new Date(m.ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>

/* ---- Entr\u00e9e en stock / correction d'inventaire : cat\u00e9gorie puis produit ---- */
let mvtType='ENTREE';
let mvtCreation=false;

  mvtType=type;mvtCreation=false;
  const entree=type==='ENTREE';
  const cats=ordreCats().concat([...new Set(S.produits.map(x=>x.cat).filter(Boolean))]).filter((v,i,a)=>a.indexOf(v)===i);

   <label class="field"><span>1. Cat\u00e9gorie</span>
     <select id="mcat" onchange="majProduitsCat()">${['',...cats].map(c=>`<option value="${esc(c)}" ${cat===c?'selected':''}>${c?esc(c):'\u2014 choisir \u2014'}</option>`).join('')}</select></label>
   <label class="field" id="wmp"><span>2. Produit</span>
     <select id="mp" onchange="infoProduitMvt()"><option value="">\u2014 choisir \u2014</option></select></label>
   ${entree&&S.role==='admin'?`<button class="btn ghost sm" id="bcreer" style="margin:-6px 0 12px" onclick="modeCreationMvt(true)">+ Nouveau produit</button>
   <div id="zcreer" class="hidden">
     <label class="field"><span>2. Nom du nouveau produit</span><input type="text" id="cn" autocomplete="off"></label>
     <label class="field"><span>Marque <span class="muted">(facultatif)</span></span>
       <select id="cmq" onchange="$('#wcmq').classList.toggle('hidden',this.value!=='__new')"><option value="">\u2014 aucune \u2014</option>
       ${listeMarques().sort((a,b)=>a.localeCompare(b,'fr',{sensitivity:'base'})).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
       <option value="__new">+ Nouvelle marque\u2026</option></select></label>
     <label class="field hidden" id="wcmq"><span>Nom de la nouvelle marque</span><input type="text" id="cmqn"></label>
     <label class="field"><span>Prix de vente</span><input type="number" id="cpv" step="0.5" min="0"></label>
     <button class="btn ghost sm" style="margin:-4px 0 12px" onclick="modeCreationMvt(false)">\u2190 Choisir un produit existant</button></div>`:''}
   <div id="minfo"></div>
   <label class="field"><span>${entree?'Quantit\u00e9 re\u00e7ue':'Stock r\u00e9el compt\u00e9'}</span>
     <input type="number" id="mq" step="1" oninput="apercuPMP()"></label>
   ${entree?`<label class="field"><span>Prix d\u2019achat de ce lot</span>
     <input type="number" id="mpa" step="0.5" oninput="apercuPMP()"></label>
     <div id="mpmp"></div>`:'<p class="muted">Une correction d\u2019inventaire ajuste la quantit\u00e9 : le prix d\u2019achat n\u2019est pas modifi\u00e9.</p>'}
   ${selectOperateur('mop')}
   <label class="field"><span>Commentaire</span>
     <input type="text" id="mc" value="${esc(com)}" placeholder="${entree?'N\u00b0 de facture, fournisseur\u2026':'Motif'}"></label>
   <div class="modal-ft"><button class="btn ghost" onclick="fermer()">Annuler</button>
    ${entree?`<button class="btn ghost" onclick="validerMouvement('ENTREE',true)">Valider et suivant</button>`:''}
    <button class="btn" onclick="validerMouvement('${type}')">Valider</button></div>`);
  majProduitsCat();
  if(garde&&garde.prod){const s=$('#mp');if(s){s.value=garde.prod;infoProduitMvt()}}
}
function majProduitsCat(){
  const c=($('#mcat')||{}).value||'',s=$('#mp');if(!s)return;
  const l=S.produits.filter(p=>p.actif!==false&&(!c||p.cat===c)).sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b),'fr'));
  s.innerHTML='<option value="">\u2014 choisir \u2014</option>'+l.map(p=>`<option value="${p.id}">${esc(nomComplet(p))}</option>`).join('');
  const z=$('#minfo');
  if(z)z.innerHTML=c&&!l.length?`<div class="card" style="background:var(--or-pale);box-shadow:none;padding:10px 12px;margin-bottom:12px">
     Aucun produit dans cette cat\u00e9gorie.${S.role==='admin'&&mvtType==='ENTREE'?' <button class="btn ghost sm" style="margin-top:8px" onclick="modeCreationMvt(true)">Cr\u00e9er le produit ici</button>':''}</div>`:'';
  infoProduitMvt();
}
function infoProduitMvt(){
  const id=($('#mp')||{}).value,z=$('#minfo');if(!z)return;
  const p=S.produits.find(x=>x.id===id);
  if(!p){apercuPMP();return}
  z.innerHTML=`<div class="card" style="background:var(--creme2);box-shadow:none;padding:10px 12px;margin-bottom:12px">
    Stock actuel <b>${nb(p.stock||0)}</b> \u00b7 prix d\u2019achat ${eur(p.pa)}${p.dateEntree?' \u00b7 derni\u00e8re entr\u00e9e le '+dateFr(p.dateEntree):''}</div>`;
  const pa=$('#mpa');if(pa&&!pa.value)pa.value=p.pa||0;
  apercuPMP();
}
function apercuPMP(){
  const z=$('#mpmp');if(!z)return;
  const p=S.produits.find(x=>x.id===($('#mp')||{}).value);
  const q=+($('#mq')||{}).value||0,lot=+($('#mpa')||{}).value||0;
  if(!p||q<=0||lot<=0){z.innerHTML='';return}
  const st=Math.max(0,+p.stock||0),ancien=+p.pa||0;
  const pmp=st>0&&ancien>0?(st*ancien+q*lot)/(st+q):lot;
  z.innerHTML=`<div class="card" style="background:var(--or-pale);box-shadow:none;padding:10px 12px;margin-bottom:12px">
    ${st>0&&ancien>0
      ? `${nb(st)} \u00e0 ${eur(ancien)} + ${nb(q)} \u00e0 ${eur(lot)} \u2192 nouveau prix moyen <b>${eur(pmp)}</b>`
      : `Stock \u00e0 ${nb(st)} \u2014 aucune moyenne \u00e0 faire : le prix d\u2019achat de la fiche passe de ${eur(ancien)} \u00e0 <b>${eur(lot)}</b>`}
    </div>`;
}
function modeCreationMvt(on){
  mvtCreation=on;
  $('#zcreer').classList.toggle('hidden',!on);$('#wmp').classList.toggle('hidden',on);
  const b=$('#bcreer');if(b)b.classList.toggle('hidden',on);
  const z=$('#minfo');if(z&&on)z.innerHTML='';
  if(on){const n=$('#cn');if(n)n.focus()}else infoProduitMvt();
}
async function creerViaEntree(suivant){
  const cat=($('#mcat')||{}).value||'';if(!cat)return toast('Choisis une cat\u00e9gorie','ko');
  const nom=majuscule(($('#cn')||{}).value||'');if(!nom)return toast('Nom du produit obligatoire','ko');
  const sm=$('#cmq').value,marque=canonMarque(sm==='__new'?majuscule(($('#cmqn')||{}).value||''):sm);
  const q=Math.round(+$('#mq').value);if(isNaN(q)||q<0)return toast('Quantit\u00e9 manquante','ko');
  const ex=S.produits.find(p=>p.nom.toLowerCase()===nom.toLowerCase()&&(p.marque||'').toLowerCase()===marque.toLowerCase());
  if(ex)return toast('\u00ab '+nomComplet(ex)+' \u00bb existe d\u00e9j\u00e0 \u2014 choisis-le dans la liste','ko');
  const lot=+($('#mpa')||{}).value||0,pv=+$('#cpv').value||0,com=$('#mc').value.trim();
  const libelle=nom+(marque?' '+marque:''),id=slug(libelle);
  if(S.produits.find(p=>p.id===id))return toast('Ce produit existe d\u00e9j\u00e0','ko');
  const d={nom,cat,marque,pa:lot,pv,stock:q,seuil:3,actif:true,favori:false,codeBarre:libelle,dateEntree:today(),maj:Date.now(),origine:'entree'};
  const op=operateurChoisi('mop');
  try{
    const b=db.batch();
    b.set(col('produits').doc(id),d);
    if(q)b.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:id,nom:nomComplet(d),type:'ENTREE',qte:q,vendeur:operateurChoisi('mop'),com:com||'Cr\u00e9ation \u00e0 l\u2019entr\u00e9e en stock',...(lot?{paLot:lot,paMoyen:lot}:{})});
    await b.commit();
    if(!S.produits.find(p=>p.id===id))S.produits.push(Object.assign({id},d));
    await ajouterMarqueListe(marque);
    toast(nomComplet(d)+' cr\u00e9\u00e9 \u00b7 stock '+q,'ok');
    fermer();
    if(suivant){mouvementStock('ENTREE',{cat,com});const s=$('#mop');if(s&&op)s.value=op}else vueStock();
  }catch(e){toast('Refus\u00e9 : '+(e.code||e.message),'ko')}
}
async function validerMouvement(type,suivant){
  if(mvtCreation&&type==='ENTREE')return creerViaEntree(suivant);
  const id=($('#mp')||{}).value,q=+$('#mq').value;
  const p=S.produits.find(x=>x.id===id);
  if(!p)return toast('Choisis un produit','ko');
  if(isNaN(q))return toast('Quantit\u00e9 manquante','ko');
  const entree=type==='ENTREE';
  const delta=entree?q:q-(+p.stock||0);
  const com=$('#mc').value.trim(),cat=($('#mcat')||{}).value||'';
  let pmp=null,lot=0;
  if(entree){
    lot=+($('#mpa')||{}).value||0;
    if(lot>0){
      const st=Math.max(0,+p.stock||0),ancien=+p.pa||0;
      pmp=st>0&&ancien>0?Math.round(((st*ancien+q*lot)/(st+q))*100)/100:lot;
    }
  }
  try{
    const b=db.batch();
    const maj={stock:firebase.firestore.FieldValue.increment(delta)};
    if(entree){maj.dateEntree=today();if(pmp!==null)maj.pa=pmp}
    b.update(col('produits').doc(p.id),maj);
    b.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:p.id,nom:nomComplet(p),type,qte:delta,
      vendeur:operateurChoisi('mop'),com,
      ...(entree&&lot>0?{paLot:lot,paMoyen:pmp}:{})});
    await b.commit();
    toast(entree?'Entr\u00e9e enregistr\u00e9e'+(pmp!==null?' \u00b7 PA moyen '+eur(pmp):''):'Stock corrig\u00e9','ok');
    if(suivant){const op=operateurChoisi('mop');fermer();mouvementStock('ENTREE',{cat,com});const s=$('#mop');if(s)s.value=op}
    else{fermer();vueStock()}
  }catch(e){toast('Refus\u00e9 : '+(e.code||e.message),'ko')}
}

function importStock(){
  modale(`<h2>Importer un stock</h2>
   <p class="muted">Fichier Excel ou CSV avec deux colonnes : <b>nom du produit</b> et <b>quantit\u00e9</b> (premi\u00e8re ligne = en-t\u00eates).</p>
   <input type="file" id="fst" accept=".xlsx,.xls,.csv" style="margin:14px 0">
   <div id="stprev"></div>
   <div class="modal-ft"><button class="btn ghost" onclick="fermer()">Annuler</button>
    <button class="btn" onclick="lancerImportStock()">Importer</button></div>`);
}
let stockLu=null;
document.addEventListener('change',async e=>{
  if(e.target.id!=='fst')return;
  const f=e.target.files[0];if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).slice(1);
  stockLu=rows.map(r=>({nom:String(r[0]||'').trim(),qte:+r[1]||0})).filter(x=>x.nom);
  const ok=stockLu.filter(x=>S.produits.find(p=>p.nom.toLowerCase()===x.nom.toLowerCase()));
  $('#stprev').innerHTML=`<div class="kpi"><div class="l">Lignes lues</div><div class="v">${stockLu.length}</div>
    <div class="d">${ok.length} produits reconnus \u00b7 ${stockLu.length-ok.length} inconnus (ignor\u00e9s)</div></div>`;
});
async function lancerImportStock(){
  if(!stockLu)return toast('Aucun fichier','ko');
  let n=0,b=db.batch(),c=0;
  for(const x of stockLu){
    const p=S.produits.find(q=>q.nom.toLowerCase()===x.nom.toLowerCase());if(!p)continue;
    b.update(col('produits').doc(p.id),{stock:x.qte});
    b.set(col('mouvements').doc(),{ts:Date.now(),date:today(),ref:p.id,nom:nomComplet(p),type:'INVENTAIRE',qte:x.qte-(+p.stock||0),vendeur:S.vendeur.nom,com:'Import fichier'});
    n++;c+=2;if(c>=400){await b.commit();b=db.batch();c=0}
  }
  if(c)await b.commit();
  fermer();toast(n+' stocks import\u00e9s','ok');vueStock();
}

/* ============ MODE INVENTAIRE ============ */
let invActif=false,inv={comptes:{},prix:{},nouveaux:[],debut:null},invOuvertes=new Set(),invQ='';
function invAdmin(){return S.role==='admin'}
function invCharger(){try{const x=JSON.parse(localStorage.getItem('ANAQA_INV')||'null');if(!x||!x.comptes)return null;x.prix=x.prix||{};x.nouveaux=x.nouveaux||[];return x}catch(e){return null}}
function invSauver(){try{localStorage.setItem('ANAQA_INV',JSON.stringify(inv))}catch(e){}}
function invVider(){localStorage.removeItem('ANAQA_INV');inv={comptes:{},prix:{},nouveaux:[],debut:null}}
function invProduits(){return S.produits.filter(p=>p.actif!==false)}
function invNbComptes(l){return (l||invProduits()).filter(p=>inv.comptes[p.id]!==undefined&&inv.comptes[p.id]!=='').length}
function ouvrirInventaire(){
  const b=invCharger();
  if(b&&(Object.keys(b.comptes).length||Object.keys(b.prix).length)){
    modale(`<h2>Inventaire en cours</h2>
     <p class="muted">Un comptage commenc\u00e9 le ${new Date(b.debut).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} a \u00e9t\u00e9 retrouv\u00e9 sur cet appareil : <b style="color:var(--anthracite)">${Object.keys(b.comptes).length} produit(s) d\u00e9j\u00e0 compt\u00e9(s)</b>.</p>
     <div class="modal-ft"><button class="btn ghost" onclick="invVider();inv.debut=Date.now();fermer();vueInventaire()">Recommencer</button>
       <button class="btn" onclick="inv=invCharger();fermer();vueInventaire()">Reprendre</button></div>`);
    return;
  }
  inv={comptes:{},prix:{},nouveaux:[],debut:Date.now()};vueInventaire();
}
function ecartHtml(p){
  const v=inv.comptes[p.id];
  if(v===undefined||v==='')return '';
  const d=(+v)-(+p.stock||0);
  if(d>0)return `<span style="color:var(--vert)">+${nb(d)}</span>`;
  if(d<0)return `<span style="color:var(--rouge)">${nb(d)}</span>`;
  return '<span class="muted">=</span>';
}
