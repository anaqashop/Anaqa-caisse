       ${invAdmin()?`<button class="btn ghost" onclick="ficheAbsent('')">+ Produit absent</button>`
         :`<button class="btn ghost" disabled title="R\u00e9serv\u00e9 \u00e0 l\u2019appareil administrateur">+ Produit absent</button>`}</div>
     ${invAdmin()?'':'<p class="muted" style="font-size:12px;margin:-4px 0 8px">Cr\u00e9ation de produit et correction des prix r\u00e9serv\u00e9es \u00e0 l\u2019appareil administrateur.</p>'}
     ${q?'':`<div class="replis-outils"><button class="btn ghost sm" onclick="invOuvertes=new Set(categoriesProduits());vueInventaire()">Tout d\u00e9plier</button>
       <button class="btn ghost sm" onclick="invOuvertes=new Set();vueInventaire()">Tout replier</button></div>`}
     ${groupes.map(g=>{
       const ouvert=!!q||invOuvertes.has(g.c);

         <div class="grp-hd" onclick="invBasculer('${esc(g.c)}')">
           <span class="grp-fl">${ouvert?'\u25BC':'\u25B6'}</span><b>${esc(g.c||'Sans cat\u00e9gorie')}</b>
           <span class="muted" id="invg-${slug(g.c||'x')}">${invNbComptes(g.tous)}/${g.tous.length}</span></div>

function invPrix(e){
  const i=e.target,id=i.dataset.id,k=i.dataset.k,p=S.produits.find(x=>x.id===id);if(!p)return;
  const v=i.value.trim();
  const pr=Object.assign({},inv.prix[id]||{});
  if(v===''||Math.abs((+v)-(+p[k]||0))<0.001)delete pr[k];else pr[k]=Math.round((+v)*100)/100;
  if(Object.keys(pr).length)inv.prix[id]=pr;else delete inv.prix[id];
  i.classList.toggle('modif',pr[k]!==undefined);
  if(!inv.debut)inv.debut=Date.now();
  invSauver();
}

function calculInventaire(zero){
  const lignes=[];
  invProduits().forEach(p=>{
    const v=inv.comptes[p.id];
    let compte=null;
    if(v!==undefined&&v!=='')compte=+v;else if(zero)compte=0;
    if(compte===null)return;
    const th=+p.stock||0,d=compte-th;
    lignes.push({p,compte,d});
  });
  const ecarts=lignes.filter(x=>x.d!==0);
  const prix=Object.keys(inv.prix||{}).map(id=>({p:S.produits.find(x=>x.id===id),m:inv.prix[id]})).filter(x=>x.p&&Object.keys(x.m).length);
  return {lignes,ecarts,prix,
    plus:ecarts.filter(x=>x.d>0).reduce((s,x)=>s+x.d,0),
    moins:ecarts.filter(x=>x.d<0).reduce((s,x)=>s+x.d,0),
    valeur:ecarts.reduce((s,x)=>s+x.d*(+x.p.pa||0),0)};
}

/* ============ R\u00c9SUM\u00c9S JOURNALIERS (statistiques rapides) ============ */
function cleResume(s){return String(s||'\u2014').replace(/[.\/\[\]*~`]/g,' ').trim()||'\u2014'}
function resumeVide(){return {ca:0,marge:0,qte:0,nbt:0,nbDocs:0,rem:0,modes:{CB:0,ESP:0,AVOIR:0,NR:0},vend:{},prod:{}}}
function ajouterAuResume(R,v){
  R.ca+=(+v.total||0);R.marge+=(+v.marge||0);R.rem+=(+v.remiseTotale||0);R.nbDocs+=1;
  if(v.type!=='RETOUR')R.nbt+=1;
  (v.lignes||[]).forEach(l=>{R.qte+=(+l.qte||0);const k=cleResume(l.nom);const p=R.prod[k]||(R.prod[k]={ca:0,q:0});p.ca+=(+l.total||0);p.q+=(+l.qte||0)});
  (v.reglements&&v.reglements.length?v.reglements:[{mode:v.mode||'NR',montant:v.total}])
    .forEach(r=>{if(r.mode==='ECHANGE')return;const m=['CB','ESP','AVOIR'].includes(r.mode)?r.mode:'NR';R.modes[m]+=(+r.montant||0)});
  const kv=cleResume(vendeurDe(v));R.vend[kv]=(R.vend[kv]||0)+(+v.total||0);
  return R;
}
function fusionnerResumes(A,B){
  ['ca','marge','qte','nbt','nbDocs','rem'].forEach(k=>A[k]+=(+B[k]||0));
  Object.keys(B.modes||{}).forEach(m=>A.modes[m]=(A.modes[m]||0)+(+B.modes[m]||0));
  Object.keys(B.vend||{}).forEach(k=>A.vend[k]=(A.vend[k]||0)+(+B.vend[k]||0));
  Object.keys(B.prod||{}).forEach(k=>{const p=A.prod[k]||(A.prod[k]={ca:0,q:0});p.ca+=(+(B.prod[k]||{}).ca||0);p.q+=(+(B.prod[k]||{}).q||0)});
  return A;
}
/* Increments Firestore : chaque vente ajoute sa part au r\u00e9sum\u00e9 de son jour */
function incrementsResume(R){
  const inc=n=>firebase.firestore.FieldValue.increment(+(+n).toFixed(2));
  const o={ca:inc(R.ca),marge:inc(R.marge),qte:inc(R.qte),nbt:inc(R.nbt),nbDocs:inc(R.nbDocs),rem:inc(R.rem),modes:{},vend:{},prod:{}};
  Object.keys(R.modes).forEach(m=>{if(R.modes[m])o.modes[m]=inc(R.modes[m])});
  Object.keys(R.vend).forEach(k=>o.vend[k]=inc(R.vend[k]));
  Object.keys(R.prod).forEach(k=>o.prod[k]={ca:inc(R.prod[k].ca),q:inc(R.prod[k].q)});
  return o;
}
function ecrireResume(batch,v){
  try{batch.set(col('resumes').doc(v.date),Object.assign({date:v.date,maj:Date.now()},incrementsResume(ajouterAuResume(resumeVide(),v))),{merge:true})}catch(e){}
}
function avecDelai(promesse,ms){
  return Promise.race([promesse,new Promise((_,rej)=>setTimeout(()=>rej(new Error('D\u00e9lai d\u00e9pass\u00e9')),ms))]);
}
async function chargerResumes(a,b){
  const k='R|'+a+'|'+b;
  if(S.resumesCache&&S.resumesCache.k===k)return S.resumesCache.v;
  const s=await col('resumes').where('date','>=',a).where('date','<=',b).get();
  const R=resumeVide();s.docs.forEach(d=>fusionnerResumes(R,d.data()));
  R.jours=s.size;S.resumesCache={k,v:R};return R;
}
/* Recalcul complet depuis toutes les ventes (historique import\u00e9 compris) */
async function recalculerResumes(){
  if(!confirm('Recalculer les statistiques \u00e0 partir de toutes les ventes enregistr\u00e9es ? \u00c0 faire de pr\u00e9f\u00e9rence depuis un ordinateur : l\u2019op\u00e9ration peut prendre une minute.'))return;
  modale(`<h2>Recalcul des statistiques</h2><p id="rcprog" class="muted">Lecture des ventes\u2026</p>`);
  try{
    const parJour={};let dernier=null,n=0;
    for(;;){
      let q=col('ventes').orderBy('date').limit(500);if(dernier)q=q.startAfter(dernier);
      const s=await q.get();if(s.empty)break;
      s.docs.forEach(d=>{const v=d.data();if(!v.date)return;ajouterAuResume(parJour[v.date]||(parJour[v.date]=resumeVide()),v);n++});
      dernier=s.docs[s.docs.length-1];
      const p=$('#rcprog');if(p)p.textContent=n+' ventes lues\u2026';
      if(s.size<500)break;
    }
    const dates=Object.keys(parJour);let b=db.batch(),k=0;
    for(const d of dates){
      const R=parJour[d];const arr=o=>{const r={};Object.keys(o).forEach(x=>r[x]=+(+o[x]).toFixed(2));return r};
      b.set(col('resumes').doc(d),{date:d,maj:Date.now(),ca:+R.ca.toFixed(2),marge:+R.marge.toFixed(2),qte:R.qte,nbt:R.nbt,nbDocs:R.nbDocs,rem:+R.rem.toFixed(2),
        modes:arr(R.modes),vend:arr(R.vend),prod:Object.fromEntries(Object.entries(R.prod).map(([x,p])=>[x,{ca:+p.ca.toFixed(2),q:p.q}]))});
      if(++k>=400){await b.commit();b=db.batch();k=0}
    }
    if(k)await b.commit();
    S.resumesCache=null;fermer();toast(n+' ventes \u2192 '+dates.length+' jours recalcul\u00e9s','ok');
  }catch(e){fermer();toast('Recalcul impossible : '+(e.code||e.message),'ko')}
}

  const d=new Date(dateStat+'T12:00:00');
  if(perStat==='jour')return [dateStat,dateStat];
  if(perStat==='semaine'){const j=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-j);const b=new Date(a);b.setDate(a.getDate()+6);
    return [a.toISOString().slice(0,10),b.toISOString().slice(0,10)]}
  if(perStat==='mois')return [dateStat.slice(0,7)+'-01',dateStat.slice(0,7)+'-31'];
  if(perStat==='annee')return [dateStat.slice(0,4)+'-01-01',dateStat.slice(0,4)+'-12-31'];
  return ['2000-01-01','2100-01-01'];
}

async function appliquerCorrection(num,nom,id,avant){

      vendeurCorrige:nom,vendeurCorrigeId:id,

async function viderCollection(nom){
  let n=0;
  for(let tour=0;tour<40;tour++){
    const s=await col(nom).limit(400).get();
    if(s.empty)break;
    const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();
    n+=s.size;if(s.size<400)break;
  }
  return n;
}
async function lancerReset(){
  const v=$('#rv').checked,st=$('#rs').checked,c=$('#rc').checked;
  const btn=$('#brst');btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  let msg=[];
  try{
    if(v){
      msg.push(await viderCollection('ventes')+' ventes');
      await viderCollection('resumes');S.resumesCache=null;
      msg.push(await viderCollection('mouvements')+' mouvements');
      msg.push(await viderCollection('avoirs')+' avoirs');
      localStorage.removeItem('ANAQA_CPT');
    }
    if(c){msg.push(await viderCollection('produits')+' produits supprim\u00e9s')}
    else if(st){
      let b=db.batch(),k=0,n=0;
      for(const p of S.produits){
        b.update(col('produits').doc(p.id),{stock:0,dateEntree:null});n++;
        if(++k>=400){await b.commit();b=db.batch();k=0}
      }
      if(k)await b.commit();
      msg.push(n+' stocks remis \u00e0 0');
    }
    S.ventesCache=null;caJour.charge=false;
    fermer();toast('R\u00e9initialis\u00e9 : '+msg.join(', '),'ok');
    majCAJour(true);rendre();
  }catch(e){
    btn.disabled=false;btn.textContent='Effacer d\u00e9finitivement';
    toast('Refus\u00e9 : '+(e.code||e.message),'ko');
  }
}

/* ---- D\u00e9coupage des noms contenant une marque ---- */
function propositionsDecoupage(){
  const marques=listeMarques();
  const variantes=[...marques.map(m=>[cleMq(m),m]),...Object.entries(ALIAS_MARQUES).filter(([k])=>k.length>2)]
    .sort((a,b)=>b[0].length-a[0].length);
  const out=[];
  S.produits.filter(p=>p.actif!==false&&!p.marque).forEach(p=>{
    const toks=cleMq(p.nom).split(' ');
    for(const [v,canon] of variantes){
      const vt=v.split(' ');
      for(let i=0;i+vt.length<=toks.length;i++){
        if(vt.every((t,j)=>toks[i+j]===t)){
          const reste=p.nom.split(/\s+/).filter((_,j)=>j<i||j>=i+vt.length).join(' ').trim();
          if(reste){out.push({p,nom:reste.charAt(0).toUpperCase()+reste.slice(1),marque:canon});return}
        }
      }
    }
  });
  return out;
}
function ouvrirDecoupage(){
  const l=propositionsDecoupage();
  modale(`<h2>D\u00e9couper les noms</h2>
   <p class="muted">Coche les produits \u00e0 transformer. Le stock, les prix et l\u2019historique restent attach\u00e9s \u00e0 la m\u00eame fiche.</p>
   <div style="max-height:50vh;overflow-y:auto;margin:10px 0">${l.map((x,i)=>`<label class="ligne" style="cursor:pointer">
     <input type="checkbox" class="dec" data-i="${i}" checked style="width:auto">
     <div class="info"><div class="nom">${esc(x.p.nom)}</div><div class="det">\u2192 <b>${esc(x.nom)}</b> \u00b7 <b>${esc(x.marque)}</b></div></div></label>`).join('')}</div>

     <button class="btn" onclick="appliquerDecoupage()">Appliquer</button></div>`,'lg');
}
async function appliquerDecoupage(){
  const l=propositionsDecoupage();
  const choix=[...document.querySelectorAll('.dec')].filter(c=>c.checked).map(c=>l[+c.dataset.i]).filter(Boolean);
  if(!choix.length)return fermer();
  try{
    let b=db.batch(),k=0;
    for(const x of choix){b.update(col('produits').doc(x.p.id),{nom:x.nom,marque:x.marque,maj:Date.now()});if(++k>=400){await b.commit();b=db.batch();k=0}}

}

function codeAppsScript(){
  const code=`// Google Apps Script \u2014 export quotidien Firestore vers Google Sheets
// Extensions > Apps Script, colle ce code, puis D\u00e9clencheurs > Ajouter > exportAnaqa > Horaire > 23h
const PROJET='${(S.cfg||{}).projectId||'TON_PROJET'}';
const BOUTIQUE='${S.bid}';
const CLE='COLLE_ICI_LA_CLE_API_WEB'; // Firebase > Param\u00e8tres > apiKey
const EMAIL='compte@exemple.com';     // compte de service caisse
const MDP='mot_de_passe';

function exportAnaqa(){
  const t=UrlFetchApp.fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CLE,
    {method:'post',contentType:'application/json',payload:JSON.stringify({email:EMAIL,password:MDP,returnSecureToken:true})});
  const id=JSON.parse(t).idToken;
  const hier=Utilities.formatDate(new Date(Date.now()-864e5),'Europe/Paris','yyyy-MM-dd');
  const q={structuredQuery:{from:[{collectionId:'ventes'}],
    where:{fieldFilter:{field:{fieldPath:'date'},op:'EQUAL',value:{stringValue:hier}}}}};
  const r=UrlFetchApp.fetch('https://firestore.googleapis.com/v1/projects/'+PROJET+'/databases/(default)/documents/boutiques/'+BOUTIQUE+':runQuery',
    {method:'post',contentType:'application/json',headers:{Authorization:'Bearer '+id},payload:JSON.stringify(q)});
  const sh=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('BDD')||SpreadsheetApp.getActiveSpreadsheet().insertSheet('BDD');
  if(sh.getLastRow()===0)sh.appendRow(['Date','Ticket','Type','Vendeur','Produit','Qt\u00e9','Prix achat','PV unitaire','Remise','PV total','Marge','Mode de r\u00e8glement']);
  JSON.parse(r).forEach(function(x){
    if(!x.document)return;
    const f=x.document.fields, L=(f.lignes&&f.lignes.arrayValue.values)||[];
    L.forEach(function(lv){
      const l=lv.mapValue.fields, n=function(k){return l[k]?Number(l[k].doubleValue||l[k].integerValue||0):0};
      sh.appendRow([f.date.stringValue,f.num.stringValue,f.type.stringValue,(f.vendeur||{}).stringValue||'',
        l.nom.stringValue,n('qte'),n('pa'),n('pv'),n('remise'),n('total'),
        (n('total')-n('pa')*n('qte')).toFixed(2),(f.mode||{}).stringValue||'Non renseign\u00e9']);
    });
  });
}`;
  modale(`<h2>Export automatique vers Google Sheets</h2>
   <p class="muted">\u00c0 coller dans Apps Script depuis ta feuille Google Sheets, avec un d\u00e9clencheur quotidien \u00e0 23\u00a0h. Une ligne par ligne de vente, colonnes align\u00e9es sur ta BDD.</p>
   <textarea rows="14" style="font-family:monospace;font-size:11px;margin-top:10px" onclick="this.select()">${esc(code)}</textarea>
   <div class="modal-ft"><button class="btn" onclick="fermer()">Fermer</button></div>`,'lg');
}

const CATMAP={'livre':'Livre','parfum':'Parfum','enfant':'V\u00eatement enfant'};
function normCat(c){if(!c)return '';const s=String(c).trim(),k=s.toLowerCase();
  return CATMAP[k]||(s===s.toUpperCase()?s.charAt(0)+s.slice(1).toLowerCase():s)}
function titre(s){s=String(s||'').trim();return s?s.charAt(0).toUpperCase()+s.slice(1):''}

async function analyserFichier(e){
  const f=e.target.files[0];if(!f)return;
  $('#iprev').innerHTML='<div class="card"><span class="spin" style="border-color:#ddd;border-top-color:var(--or)"></span> Lecture\u2026</div>';
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const nomBDD=wb.SheetNames.find(n=>n.trim().toUpperCase()==='BDD');
    if(!nomBDD)throw new Error('Feuille BDD introuvable');
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[nomBDD],{defval:null});
    const prods={};
    rows.forEach(r=>{
      const k=r['CL\u00c9_FAM']||r['CLE_FAM'];
      if(k&&String(k).trim()){const nom=titre(k);
        prods[nom.toLowerCase()]={nom,cat:normCat(r['CAT_FAM']),famille:nom,type:'famille',
          pa:+r['PA_FAM']||0,pv:+r['PV_FAM']||0}}
    });
    rows.forEach(r=>{
      const k=r['CL\u00c9_SF']||r['CLE_SF'];
      if(k&&String(k).trim()){const nom=titre(k),kk=nom.toLowerCase();if(prods[kk])return;
        const fam=titre(r['FAM_SF']),base=prods[fam.toLowerCase()]||{};
        prods[kk]={nom,cat:normCat(r['CAT_SF']),famille:fam,type:'sousfamille',pa:base.pa||0,pv:base.pv||0}}
    });
    const liste=Object.values(prods);
    const nouveaux=liste.filter(p=>!S.produits.find(x=>x.id===slug(p.nom)));
    const majPrix=liste.filter(p=>{const x=S.produits.find(y=>y.id===slug(p.nom));
      return x&&(Math.abs((+x.pa||0)-p.pa)>0.001||Math.abs((+x.pv||0)-p.pv)>0.001)});
    const ventes=[];
    rows.forEach(r=>{
      const d=r['Date'];if(!d)return;
      const iso=(d instanceof Date)?new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10):String(d).slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)||iso<DATE_DEBUT)return;
      const nom=titre(r['Sous famille produit']||r['Famille Produit']);if(!nom)return;
      const qte=+r['Qt\u00e9']||1,pa=+r["Prix d'achat"]||0,pv=+r['Prix de vente unitaire']||0;
      const tot=r['Prix de vente total']!=null?+r['Prix de vente total']:pv*qte;
      const m=String(r['Mode de r\u00e8glement']||'').trim().toLowerCase();
      ventes.push({date:iso,nom,ref:slug(nom),qte,pa,pv,total:+(tot||0),
        mode:m.startsWith('cb')?'CB':(m.startsWith('esp')?'ESP':'NR')});
    });
    const ca=ventes.reduce((s,v)=>s+v.total,0);
    const jours=new Set(ventes.map(v=>v.date)).size;
    impData={liste,nouveaux,majPrix,ventes};
    $('#iprev').innerHTML=`<div class="kpis">
      <div class="kpi"><div class="l">Produits dans le fichier</div><div class="v">${liste.length}</div>
        <div class="d">${nouveaux.length} nouveaux \u00b7 ${majPrix.length} prix diff\u00e9rents \u00b7 ${liste.filter(p=>!p.pv).length} sans prix</div></div>
      <div class="kpi"><div class="l">Ventes depuis le ${dateFr(DATE_DEBUT)}</div><div class="v">${nb(ventes.length)}</div>
        <div class="d">${nb(jours)} jours \u00b7 ${eur(ca)}</div></div>
      <div class="kpi"><div class="l">R\u00e8glements</div><div class="v" style="font-size:17px">
        ${nb(ventes.filter(v=>v.mode==='CB').length)} CB \u00b7 ${nb(ventes.filter(v=>v.mode==='ESP').length)} ESP</div>
        <div class="d">${nb(ventes.filter(v=>v.mode==='NR').length)} non renseign\u00e9s</div></div></div>
     <div class="card"><h3>Catalogue</h3>
      <label class="field"><span>Mode d\u2019import</span><select id="imode">
        <option value="ajout">Ajouter uniquement les nouveaux produits</option>
        <option value="prix">Ajouter les nouveaux et mettre \u00e0 jour les prix</option>
        <option value="remplacer">Remplacer le catalogue (les absents passent en inactif)</option>
      </select></label>
      <button class="btn" onclick="importerCatalogue()">Importer le catalogue</button></div>
     <div class="card"><h3>Historique des ventes</h3>
      <p class="muted">Les ventes sont regroup\u00e9es par jour et par mode de r\u00e8glement, marqu\u00e9es \u00ab\u00a0import\u00a0\u00bb et non modifiables. Le stock n\u2019est pas impact\u00e9. \u00c0 ne faire qu\u2019une fois.</p>
      <button class="btn ghost" style="margin-top:10px" onclick="importerHistorique()">Importer ${nb(ventes.length)} lignes de vente</button></div>`;
  }catch(err){$('#iprev').innerHTML=`<div class="card"><p style="color:var(--rouge)">Lecture impossible : ${esc(err.message)}</p></div>`}
}
async function importerCatalogue(){
  if(!impData)return;
  const mode=$('#imode').value;
  if(mode==='remplacer'&&!confirm('Remplacer le catalogue ? Les produits absents du fichier passeront en inactif (aucune suppression).'))return;
  let b=db.batch(),c=0,add=0,upd=0,off=0;
  const vus=new Set();
  for(const p of impData.liste){
    const id=slug(p.nom);vus.add(id);
    const ex=S.produits.find(x=>x.id===id);
    if(!ex){b.set(col('produits').doc(id),{nom:p.nom,cat:p.cat,famille:p.famille,type:p.type,pa:p.pa,pv:p.pv,
        stock:0,seuil:3,actif:true,favori:false,codeBarre:p.nom,maj:Date.now()});add++;c++}
    else if(mode!=='ajout'&&(Math.abs((+ex.pa||0)-p.pa)>0.001||Math.abs((+ex.pv||0)-p.pv)>0.001)){
      b.update(col('produits').doc(id),{pa:p.pa,pv:p.pv,cat:p.cat||ex.cat,maj:Date.now()});upd++;c++}
    if(c>=400){await b.commit();b=db.batch();c=0}
  }
  if(mode==='remplacer')for(const ex of S.produits){
    if(!vus.has(ex.id)&&ex.actif!==false){b.update(col('produits').doc(ex.id),{actif:false});off++;c++;
      if(c>=400){await b.commit();b=db.batch();c=0}}}
  if(c)await b.commit();
  await col('imports').add({ts:Date.now(),date:today(),par:S.vendeur.nom,type:'catalogue',mode,ajouts:add,maj:upd,desactives:off});
  toast(add+' ajout\u00e9s \u00b7 '+upd+' mis \u00e0 jour'+(off?' \u00b7 '+off+' d\u00e9sactiv\u00e9s':''),'ok');
}
async function importerHistorique(){
  if(!impData||!impData.ventes.length)return;
  if(!confirm('Importer '+impData.ventes.length+' lignes de vente ? \u00c0 ne faire qu\u2019une seule fois.'))return;
  const grp={};
  impData.ventes.forEach(v=>{const k=v.date+'|'+v.mode;(grp[k]=grp[k]||[]).push(v)});
  const cles=Object.keys(grp);
  let b=db.batch(),c=0,n=0;
  for(const k of cles){
    const [date,mode]=k.split('|'),L=grp[k];
    const total=+L.reduce((s,x)=>s+x.total,0).toFixed(2);
    const marge=+L.reduce((s,x)=>s+(x.total-x.pa*x.qte),0).toFixed(2);
    const id='IMP-'+date+'-'+mode;
    b.set(col('ventes').doc(id),{num:id,date,ts:new Date(date+'T20:00:00').getTime(),type:'VENTE',origine:'import',
      vendeur:'Historique',vendeurId:'import',refs:[...new Set(L.map(x=>x.ref))],
      lignes:L.map(x=>({ref:x.ref,nom:x.nom,qte:x.qte,pa:x.pa,pv:x.pv,remise:0,total:x.total})),
      remiseTicket:0,remiseTotale:0,total,marge,
      reglements:mode==='NR'?[]:[{mode,montant:total}],mode});
    n++;if(++c>=300){await b.commit();b=db.batch();c=0;toast(n+' / '+cles.length+' jours\u2026')}
  }
  if(c)await b.commit();
  await col('imports').add({ts:Date.now(),date:today(),par:S.vendeur.nom,type:'historique',jours:n,lignes:impData.ventes.length});
  S.ventesCache=null;fermer();toast('Historique import\u00e9 : '+n+' regroupements','ok');
}

   +'border-radius:12px;box-shadow:var(--ombre-f);font-weight:600;font-size:14px;cursor:pointer;'
   +'display:flex;align-items:center;gap:10px';
  d.innerHTML='\u21bb Version '+versionDispo+' disponible <span style="opacity:.8;font-weight:500">\u00b7 Recharger</span>';
  d.onclick=rechargerApp;
  document.body.appendChild(d);
}
async function rechargerApp(){
  try{
    if('caches' in window){const k=await caches.keys();await Promise.all(k.map(c=>caches.delete(c)))}
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()))}
  }catch(e){}
  location.reload(true);
}
setTimeout(()=>verifierVersion(true),4000);
setInterval(()=>verifierVersion(true),600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verifierVersion(true)});
</script>
